name: split
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sL https://tadedocs.github.io/tradedocs/ -o big.html && python3 -c "import re,base64;s=open('big.html',encoding='utf-8').read();[open(a,'wb').write(base64.b64decode(d)) for a,b,c,d in re.findall(r\"src:'([^']+)', name:'([^']+)', mime:'([^']+)', b64:'([^']+)'\",s)];open('index.html','w',encoding='utf-8').write(re.sub(r'<script>\s*/\* 离线版[\s\S]*?</script>','',s))"
      - run: git config user.email b@c.d && git config user.name b && git add -A && git commit -m split && git push
