name: patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f app.html.bin ]; then git rm -q app.html; git mv app.html.bin app.html; fi
          if [ -f tradedocs.apk.bin ]; then git rm -q tradedocs.apk; git mv tradedocs.apk.bin tradedocs.apk; fi
      - run: git config user.email b@c.d && git config user.name b && git add -A && git commit -m fix || true
      - run: git push
