卖方不承担任何责任。\n▸新手提示：发延期函前必须先和另一名成员对一遍。不要自己决定延几天——涉及客户罚款和后续谈判。","sub":false,"step":"订单跟进"},{"k":"ord:4","m":"ord","mn":"订单合同","s":4,"n":"验货报告单 / 验货邀请函","sc":"mixed","lay":"mixed","d":"出货前必做。跳过验货直接出货，出问题责任在自己。下方附可直接发客户的验货邀请函。","t":"INSPECTION REPORT\n────────────────────────────────────────\nInspection No.：INS-______\nOrder No.：SO-______　　Customer：____________\nFactory：____________\nInspection Date：______\nInspector：________　人数：____　方式：□全检 □抽检 ______%\nProduct / Specification：____________\nOrder Quantity：________　　Actual Packed Quantity：________\n\n一、Inspection Items 检查项目（逐项打勾并写实测值）\n  □ 外观与做工　　　实测：________________\n  □ 尺寸 / 规格　　 实测：________________\n  □ 材质确认　　　 实测：________________\n  □ 颜色 / 表面处理 实测：________________\n  □ 功能 / 装配测试 实测：________________\n  □ Logo / 定制工艺 实测：________________\n  □ 包装方式　　　 实测：________________\n  □ 箱唛 / 唛头　　实测：________________\n  □ 装箱数 / 体积　 实测：________________\n\n二、Defects 不良品\n  不良品数量：______　占比：______%\n  描述：____________________________________\n  处置：□返工 □挑出补足 □让步接收（需客户书面同意）\n\n三、Evidence 留证\n  是否拍照 / 录像：□是（存放位置 ____________）□否\n  封样比对：□一致 □不一致（说明 ____________）\n\n四、Conclusion 结论\n  □ 合格 Pass —— 准予出货\n  □ 让步放行 Concession（客户已书面同意）\n  □ 不合格 Fail —— 禁止出货\n\n验货人签字：________　日期：______　工厂确认：________\n\n=== 以下为对外发客户的正式函件 ===\n\nINSPECTION INVITATION\n\nDate：______　　Our Ref.：SO-______\nTo：____________ (Company)　　Attn：____________\n\nDear ________,\n\nWe are pleased to inform you that the goods under order ______ have reached approximately ______% completion and will be ready for inspection on ______.\n\nInspection Details\n  Date：______　　Time：9:00 a.m. / 2:00 p.m.\n  Address / Factory：____________\n  Products：____________\n\nYou or your representative are cordially invited to attend the inspection. Please confirm attendance by replying to this email before ______ (date).\n\nPlease note that if we do not receive your confirmation by the above date, we will proceed with the inspection and shipment according to our standard procedure.\n\n★固定条款｜1. 本邀请不构成对货物品质、数量或交期的承诺，也不构成对任何索赔的放弃。2. 买方未按期确认参加验货的，视为接受我方第三方验货结果。\n▸新手提示：邀请函一定要写\"不确认视为接受我方验货结果\"。没有这一句，客户不来验货，将来他投诉你说验货时他不在——你很被动。\n▸新手提示：验货结论只填「合格 / 让步放行 / 不合格」三选一，系统节点只认这三个值。","sub":false,"step":"验货"},{"k":"ord:4#1","m":"ord","mn":"订单合同","s":4,"n":"不合格整改单 / 让步接收单","sc":"mixed","lay":"mixed","d":"验货不合格时用。内部走整改，客户书面同意放行时走让步接收 —— 没有这份纸面确认，客户事后照样可以拒收。","t":"【不合格整改单】NON-CONFORMITY & CORRECTIVE ACTION\n订单号：SO-______　关联验货报告单编号：____________　开具日期：______\n▸新手提示：订单表里已经留了「返工次数 / 上次不合格项 / 返工要求 / 返工责任方 / 返工预计完成日」五个字段，这张单就是那五个字段的纸面凭据。系统里记了、纸面没有，客户追责时我们拿不出东西。\n\n一、不合格描述\n  发现环节：□自检 □客户验货 □第三方验货（SGS / BV / TÜV）□到货后客户反馈\n  发现日期：______　发现人：____________\n  不合格项目：【必填】____________\n  不合格数量 / 占比：________ / ______%　严重程度：□轻微 □一般 □严重\n  不合格等级判定：□合格 □让步放行 □不合格\n\n二、原因分析\n  原因分类：□原材料 □工艺 / 操作 □设备 □设计 / 图纸 □包装 □运输 □客户标准理解偏差\n  根本原因：____________\n  是否重复发生：□否 □是（第 ______ 次）\n\n三、整改要求\n  处理方式：【必填】□返工 □返修 □挑选 □补件 □报废重做 □让步接收（需客户书面同意）\n  返工要求：【必填】____________\n  返工责任方：【必填】□我方 □供应商 □客户原因 □物流\n  返工预计完成日：【必填】______　是否影响原交期：□否 □是（新交期 ______）\n  费用承担：□我方 □供应商 □客户 □分摊（比例 ______）\n\n四、整改验证\n  整改完成日：______　复检结论：□合格 □仍不合格（转二次整改）\n  复检人：____________　返工次数累计：______ 次\n\n五、签署\n  开具人：______　生产负责人：______　品质负责人：______　日期：______\n\n=== 以下为对外发客户的正式函件 ===\n\nCONCESSION / WAIVER REQUEST（让步接收申请）\n\nDate：______　　Our Ref.：SO-______\nTo：____________ (Company)　　Attn：____________\n\nDear ________,\n\nRegarding the inspection of the above order, we regret to inform you that ________ (item) was found not fully in conformity with the agreed specification. Details are as follows:\n\n  Non-conformity：____________\n  Quantity affected：________ （______% of total）\n  Root cause：____________\n  Corrective action taken：____________\n\nWe request your acceptance of the goods under concession on the following terms:\n  □ Price allowance of ______%  □ Free replacement in next shipment  □ Other：____________\n\nPlease confirm your acceptance in writing. Shipment will be held pending your reply.\n恳请贵司书面确认是否接受上述让步条件；在收到贵司书面回复前，本批货物暂不放行。\n\n★固定条款｜1. 让步接收以买方**书面**同意为唯一生效条件，口头、电话或即时通讯工具的确认均不构成同意；未经书面同意即放行的，买方仍有权拒收并要求退货、换货或赔偿。2. 让步接收不构成我方对同类不合格的默认许可，后续批次仍按原约定标准执行。3. 买方接受让步的，除本函所列补偿方式外不得再就同一不合格项主张其他赔偿。\n▸新手提示：没有客户书面回函就放行，是最常见的一种自作主张。客户口头说\"可以吧\"，回头照样拒收 —— 因为口头同意在他那边没有任何成本。\n▸新手提示：让步接收一定要写清补偿方式（降价 / 下次补货 / 其他）。只说\"请接受\"，客户没有理由替你承担损失。","sub":true,"step":"验货"},{"k":"ord:4#2","m":"ord","mn":"订单合同","s":4,"n":"第三方验货委托书（SGS / BV / TÜV 等）","sc":"sup","lay":"form","d":"客户指定第三方验货时用。委托书要写清验什么、按什么标准、谁来承担费用 —— 这三件事不写清，现场一定会扯皮。","t":"【第三方验货委托书】THIRD-PARTY INSPECTION NOMINATION\n受托机构：【必填】____________（□SGS □BV □TÜV □Intertek □其他 ________）\n委托日期：【必填】______　关联订单号：SO-______\n▸新手提示：委托书里一定要写清\"按什么标准判定\"。只写\"验货\"，现场判定全凭验货员个人理解，出了分歧谁也说不清。\n\n一、验货安排\n  验货地点：【必填】____________（工厂 / 仓库地址）\n  期望验货日期：【必填】______　备选日期：______\n  联系人 / 电话：【必填】____________\n  货物是否已备齐：□已备齐 □未备齐（预计 ______ 备齐）\n  验货时是否需要我方人员在场：□需要（______）□不需要\n\n二、验货范围与标准（AQL 要写清）\n  验货类型：□生产前 □生产中（DUPRO）□出货前（PSI）□监装（Loading Supervision）\n  抽检标准：【必填】□AQL 2.5/4.0（一般）□AQL 1.0/2.5（加严）□客户指定 ____________\n  抽检水平：□一般检验水平 II □客户指定 ____________\n  验货数量/比例：【必填】________（总数量 ______，抽 ______）\n\n三、验货项目\n  □ 外观 / 工艺　□ 尺寸 / 规格　□ 数量 / 装箱\n  □ 包装 / 唛头 / 标签　□ 功能测试（方法 ____________）\n  □ 安规 / 认证标识（□CE □UL □其他 ______）\n  □ 条码 / 说明书 / 配件　□ 其他：____________\n\n四、判定与报告\n  判定结论口径：□合格 / 不合格 二选一 □允许让步放行\n  报告出具时限：验货后 ______ 个工作日内\n  报告语言：□英文 □中英对照　报告接收人 / 邮箱：____________\n  不合格时是否需要现场照片：□需要 □不需要\n\n五、费用\n  验货费承担：【必填】□我方 □客户 □供应商\n  预估费用：________　计费单位：□人天（______ 人天）□按次\n  复检费用承担：□初次不合格由 ______ 承担\n\n六、签章\n  委托单位（盖章）：____________　经办人签字：____________　日期：______\n  受托机构确认：____________　确认日期：______\n\n★固定条款｜1. 受托机构应按本委托书约定的范围、AQL 标准与抽样水平出具报告，超出约定范围的判定不作为双方验收依据。2. 验货报告仅反映抽样当时的货物状态，不免除供方对未抽检部分的质量责任。3. 验货结论为不合格的，复检费用及由此产生的船期延误责任按本委托书第五条约定承担。\n▸新手提示：费用于谁承担一定要先谈定。客户临时要求加验一次，几千块就没了 —— 写在委托书上，事后不扯皮。\n▸新手提示：监装（Loading Supervision）值得单独加。柜子装了什么、装了多少，有第三方拍照留证，将来客户说短装时有据可查。","sub":true,"step":"验货"},{"k":"ord:5","m":"ord","mn":"订单合同","s":5,"n":"订舱委托书 / 发货通知","sc":"mixed","lay":"mixed","d":"只问价格不问船期的货代不要合作。ETD 一旦确认立刻通知客户（用下方发货通知）。","t":"【订舱委托信息表】SO-______\n▸新手提示：订舱前必须问货代三件事——船期、截关日、免费堆存期。只问运价不问船期，最后是自己亏。\n\n订单号：SO-______　客户名称：____________\n────────────────────────────────────────\n一、Shipping Agent 货代信息\n  货代 / 船公司：____________　联系人 / 电话：____________\n  Booking No. (S/O)：____________\n\n二、Cargo 货物信息\n  柜型柜量：□20GP □40GP □40HQ □45HQ × ____ 个\n  件数 / 包装：______ ctn　每箱数量：______ pcs\n  毛重：____ kg　　净重：____ kg　　体积：____ CBM\n\n三、Route & Schedule 航线与船期\n  装运港：____________　目的港：____________\n  截关日 CY Cut-off：【必填】______\n  开船日 ETD：______\n  预计到港 ETA：______\n  免费堆存期：______ 天\n\n四、Freight Comparison 运价比对\n  货代 A：______（船期 ______，是否含 THC：□是 □否）\n  货代 B：______（船期 ______，是否含 THC：□是 □否）\n  选定：货代 ____________　　理由：____________\n▸新手提示：比价必须同时比船期和费用包含项。只比总价，很容易被低价单证费反超。\n\n五、Confirmations 确认项\n  船期是否满足客户交期：□是 □否（说明 ____________）\n  是否已通知客户 ETD：【必填】□否 □是（日期 ______，方式 ______）\n  订舱确认人：______　日期：______\n  委托方（盖章）：____________　经办人签字：____________　日期：______\n\n=== 以下为对外发客户的正式函件 ===\n\nSHIPPING ADVICE\n\nDate：______　　Our Ref.：SO-______\nTo：____________ (Company)　　Attn：____________\n\nDear ________,\n\nWe are pleased to advise that your order has been shipped. Details are as follows:\n\n  Order No.：________\n  Invoice No.：________　　Packing List No.：________\n  B/L No.：________\n  Vessel / Voyage：________ / ________\n  Port of Loading：________\n  Port of Discharge：________\n  ETD：______　　ETA：______\n  Container No. / Seal No.：________ / ________\n\nDocuments enclosed / to follow\n  □ Commercial Invoice　□ Packing List　□ Bill of Lading (original / telex release)\n  □ Certificate of Origin　□ Insurance Certificate　□ Other：________\n\n★固定条款｜1. 货物按 ________ 条件交付，风险自装运港装船时转移。2. 提单签发方式：□正本提单 □电放，须于收到尾款后办理。3. 运费、保险及目的港费用由买方承担。\n▸新手提示：ETD 一确认就发这封信，不要等到开船才说。客户要时间安排船和仓库。\n▸新手提示：提单方式必须在这里写清。\"正本提单\"客户要付全款才拿得到单，这是重要的催款手段。","sub":false,"step":"订舱出运"},{"k":"ord:5#1","m":"ord","mn":"订单合同","s":5,"n":"VGM 载重核实与舱单申报数据表","sc":"sup","lay":"form","d":"VGM（集装箱总重核实）是强制的，没提交船公司不给装船。走美线还要 AMS/ISF、欧线要 ENS，都是截关前必须申报的。","t":"【VGM 载重核实与舱单申报数据表】\n订舱号 Booking No.：【必填】____________　船名 / 航次：____________\n▸新手提示：VGM 没提交，船公司**直接不给装船** —— 不是罚款，是上不了船。截关前 24~48 小时必须提交。\n\n一、VGM 载重核实（每个柜子一份）\n  填法：柜号｜空箱皮重(kg)｜货物毛重(kg)｜包装/垫料(kg)｜总重VGM(kg)｜称重方式｜称重单位盖章\n  1 ｜____｜____｜____｜____｜____｜____\n  2 ｜____｜____｜____｜____｜____｜____\n\n  合计总重：______ kg（各柜 VGM 相加，舱单申报总毛重以此为准）\n  称重方式：□整体称重（方法 1）□累加计算（方法 2，须经认证）\n  称重设备是否校准并在有效期内：□是 □否\n  VGM 提交截止时间：【必填】______　实际提交时间：______　提交回执号：____________\n\n二、航线附加申报（走哪条线勾哪条）\n  □ 美线 AMS：申报截止时间 ______　申报号 ____________\n  □ 美线 ISF（10+2）：须于装船前 24 小时申报；申报号 ____________\n     制造商 / 供应商名称：____________　收货人编号：____________\n  □ 欧线 ENS：申报截止时间 ______　申报号 ____________\n  □ 其他（加拿大 ACI / 日本 AFD 等）：____________\n\n三、舱单数据一致性（错了要改单，改单要钱还要时间）\n  □ 舱单的收发货人名称与提单一致\n  □ 件数 / 毛重与装箱单、发票一致\n  □ HS 编码与报关单一致\n  □ 目的港与提单一致\n\n四、签章与提交\n  申报单位（盖章）：____________　经办人签字：____________　日期：______\n\n★固定条款｜1. VGM 数据须在承运人规定的截止时间前提交，逾期未提交的承运人有权拒绝装船，由此产生的滞箱费、改配费及延误由托运人承担。2. 所申报的重量须真实准确，与实际重量偏差超出允许范围的，海关与承运人可拒绝装运并追究申报责任。3. AMS / ISF / ENS 等舱单申报数据须与实际货物及报关数据一致，申报错误的改单费用由托运人承担。\n▸新手提示：ISF 是\"装船前 24 小时\"，不是\"截关前 24 小时\"。这两个时间常常差一两天，按后者算会来不及。","sub":true,"step":"订舱出运"},{"k":"ord:5#2","m":"ord","mn":"订单合同","s":5,"n":"补料单 / 装船通知 Shipping Instruction","sc":"sup","lay":"form","d":"补料是货代出提单的唯一依据：柜号封条号、收发货人、运费条款这八项错一项，印出来的提单就要改单——改单既要付费，又要船公司和目的港都同意。截关前 24 小时是死线。","t":"【补料单 / 装船通知 SHIPPING INSTRUCTION】\n订舱号 Booking No.：【必填】____________　船名 / 航次 Vessel / Voyage：【必填】____________\n▸新手提示：补料是**出提单的唯一依据**。货代按你补的内容印提单，印错了改单既要付费又要船公司和目的港都同意。截关前 24 小时是死线。\n\n一、补料八项（每一项都要与装箱单、商业发票核对一致）\n  填法：项目｜内容｜与哪张单核对\n  发货人 Shipper｜____________｜商业发票\n  收货人 Consignee｜____________｜合同 / 客户书面确认\n  通知方 Notify｜____________｜合同 / 客户书面确认\n  品名 Description｜____________｜商业发票\n  件数 / 毛重 / 体积 Packages / G.W. / CBM｜____________｜装箱单\n  柜号与封条号 Container / Seal No.｜____________｜装柜现场记录\n  运费条款 Freight Term｜□ PREPAID □ COLLECT｜合同成交方式\n  唛头 Marks｜____________｜装箱单 / 外箱实际刷唛\n\n二、装卸港与船期\n  装运港 Port of Loading：【必填】____________　目的港 Port of Discharge：【必填】____________\n  截关日 Customs Cut-off：【必填】______　开船日 ETD：【必填】______\n  期望签发方式：□ 正本提单　□ 电放（电放必须客户书面同意且尾款已收，走 10 段步2 的见款放单红线）\n\n三、一致性自检（错了要改单，改单要钱还要时间）\n  □ 收发货人名称与合同、报关单一致（一个字母都不能差）\n  □ 件数 / 毛重 / 体积与装箱单、VGM 表（ord:5#1）一致\n  □ 柜号封条号与装柜现场记录一致（抄错一个数字，提单整行重打）\n  □ 运费条款与成交方式一致（FOB 收 COLLECT，CIF / CFR 收 PREPAID）\n  □ 唛头与外箱实际刷唛一致（无唛头写 N/M）\n\n四、发送与回执\n  发送日期：______　发送方式：□ 邮件 □ 货代系统　回执收到日期：______\n  货代确认按本单出提单草稿：□ 是　□ 否（否：写明差在哪，当天补齐）\n\n★固定条款｜1. 补料内容一经确认用于签发提单，任何变更均构成改单，改单费用及因此产生的船期延误由责任方承担。2. 补料的收发货人、通知人信息须与合同及报关数据完全一致；不一致导致目的港无法提货或清关延误的，责任由补料方承担。3. 柜号与封条号须与装柜现场记录一致，错报、虚报的按申报不实处理。\n▸新手提示：通知方这栏最常填错 —— 它不一定是收货人。客户没指定时留空让货代按提单惯例处理，也别随手抄一个上去。","sub":true,"step":"订舱出运"},{"k":"ord:5#3","m":"ord","mn":"订单合同","s":5,"n":"空运提单 AWB 核对表","sc":"in","lay":"form","d":"走空运的订单用这一份（海运那张是「提单核对」）。AWB 是客户凭以提货的凭证，签发后再改要钱；空运按计费重量收费，件数毛重体积填错就是白送运费。","t":"【空运提单 AWB 核对表】\n订单号：SO-______　订舱号：____________　制单日期：______\n▸新手提示：空运提单（AWB）不是海运提单 —— 它不是物权凭证，正本不控货。所以空运**必须在发货前收齐尾款**，别拿\"正本在我手上\"当筹码，那是海运的逻辑。\n\n一、运单主体\n  主单号 MAWB：【必填】____________\n  分单号 HAWB：____________（走拼板 / 货代分单时才有）\n  航空公司 Airline：【必填】____________　航班号 Flight No.：【必填】____________\n  航班日期 Flight Date：【必填】______\n\n二、机场三字码（写错等于把货发去另一个城市）\n  起运机场 Origin：____________（三字码，如 PVG / CAN / HKG）\n  目的机场 Destination：____________（三字码，如 LAX / FRA / DXB）\n  ▸新手提示：三字码必须和客户的清关口岸对得上。只写城市名，货代可能按同名机场发错国家。\n\n三、收发货人（与商业发票、装箱单逐字一致）\n  发货人 Shipper：____________\n  收货人 Consignee：____________\n  通知方 Notify Party：____________\n\n四、货物与计费重量（空运最贵的坑在这里）\n  品名 Description：____________\n  件数 No. of Packages：【必填】______\n  实际毛重 Actual G.W.：【必填】______ kg\n  体积 Volume：【必填】______ CBM　体积重 Volumetric Wt.：______ kg（长×宽×高cm ÷ 6000 × 件数）\n  计费重量 Chargeable Wt.（取大者）：【必填】______ kg\n  运费条款：□ PREPAID 预付 □ COLLECT 到付\n  申报价值（用于报关与保险）：____________\n  ▸新手提示：体积重 = 长×宽×高(cm) ÷ 6000 × 件数，与实际毛重**取大**计费。泡货（轻抛货）常在这里被多算一倍运费，装柜前先压一压体积。\n\n五、随货单证（随机的那一份，与客户清关口径一致）\n  □商业发票 Commercial Invoice　□装箱单 Packing List\n  □原产地证 CO / FORM E　□鉴定报告 / MSDS（带电、带磁、液体必附）\n  □熏蒸证（木质包装）　□其他 ____________\n\n六、核对与确认\n  AWB 草稿已与商业发票 / 装箱单逐项比对：□是 □否\n  已回传客户确认：□是 □否（确认方式 □邮件 □其他 ______）\n  核对人：______　复核人：______　日期：______\n▸新手提示：AWB 签发后改单要钱，且需要航司同意。草稿阶段把三字码、件数毛重、收发货人核对三遍，比签发了再改便宜得多。","sub":true,"step":"订舱出运"},{"k":"ord:6","m":"ord","mn":"订单合同","s":6,"n":"报关委托书 / 装箱单 / 商业发票 / 提单草稿核对","sc":"mixed","lay":"mixed","d":"出口四件套一起用。报关品名 / 数量 / 金额必须与合同发票完全一致，不一致会被海关查验、银行退单。","t":"===== 1. 报关委托书（对海关 / 报关行） =====\n委托方（我方公司）：____________\n报关行：____________　委托日期：______　预计报关日：______\n  合同号：____________　发票号：____________　收汇方式：□预收 □一般贸易\n  币种：________　成交方式：________\n  品名（中文）：____________　海关编码 HS Code：____________\n  数量 / 单位：________ / ________\n  金额：________　　毛重：____ kg　净重：____ kg　体积：____ CBM\n  件数 / 包装：____________ / ____________\n  装运港 / 目的港：____________ / ____________\n  委托方盖章 / 签字：________　报关行签章：________\n▸新手提示：中文品名必须与 HS 编码对应，不能随便写。写错会被查验，拖 3–5 天。\n\n===== 2. 装箱单 Packing List（对外） =====\nPACKING LIST\nPacking List No.：________　Date：______\nTo（Consignee）：____________\n────────────────────────────────────────\n序号｜Description 品名｜Specification 规格｜Qty per carton｜Cartons｜Total Qty｜N.W.(kg)｜G.W.(kg)｜CBM\n1 ｜____｜____｜____｜____｜______｜______｜______｜____\n2 ｜____｜____｜____｜____｜____｜______｜______｜____\n────────────────────────────────────────\n合计件数 Cartons：______ ctn　合计数量 Total Qty：______ pcs　合计净重 N.W.：______ kg　合计毛重 G.W.：______ kg　合计体积 CBM：______ CBM\nContainer No.：________　Seal No.：________\nShipment Mark（唛头）：\n________________________________________\n▸新手提示：装箱单上的净重毛重必须和发票、提单、报关单完全一致。这几份单据\"单单不符\"会被扣货。\n\n===== 3. 商业发票 Commercial Invoice（对外） =====\nCOMMERCIAL INVOICE\nInvoice No.：________　Date：______\nExporter (Seller)：____________\nTo (Consignee)：____________　　Attn：____________\n────────────────────────────────────────\n序号｜Description｜Specification｜Quantity｜Unit Price USD｜Amount USD\n1 ｜____｜____｜______｜________｜________\n2 ｜____｜____｜______｜________｜________\n────────────────────────────────────────\n发票金额合计 TOTAL：USD ________（大写：USD ________ only）\n合计数量 QTY：______　合计件数 TOTAL CARTONS：______ ctn\nTrade Term：________　　Currency：________\nShipment From：________　To：________\nTerms of Payment：定金 ______% T/T 前，尾款 ______% T/T 装运前\n\n▸新手提示：发票金额要和合同一致。但客户若需扣 3% 银行费，可在这行写「Invoice value: USD ___ (to cover bank charges of 3%)」——这是行业通行做法。\n\n===== 4. 提单草稿核对 B/L Draft Check（内部） =====\nShipper：________　Consignee：________（须与客户要求一致）\nNotify Party：________\nPort of Loading：________　Port of Discharge：________\nFreight Terms：□Prepaid □Collect　No. of Original B/L：______\nDescription of Goods（须与发票一致）：____________\nNo. of Packages：______ ctn　Gross Weight：____ kg　Volume：____ CBM\nContainer No.：________　Seal No.：________\n────────────────────────────────────────\n逐项核对结果：□ 已全部核对无误，可向货代确认\n★固定条款｜提单草稿必须逐字核对后再确认；确认后改单既产生费用又耽误船期。正本提单须在收到尾款后签发。\n▸新手提示：Consignee（收货人）抬头必须和客户要求一字不差。写错要作废重出，费用和船期都耽误。","sub":false,"step":"报关单证"},{"k":"ord:6#1","m":"ord","mn":"订单合同","s":6,"n":"出口报关单信息登记与核对表","sc":"in","lay":"form","d":"海关放行拿到报关单后，把上面每一栏登记进来留档。退税、核销、查单、复购都要用；报关单号同时是「出口退税」节点的放行条件。","t":"【出口报关单信息登记与核对表】关联订单 ______\n▸新手提示：报关单是出口合法凭证，也是退税与收汇核销的申报依据。放行当天就登记，不要等退税时才回头翻。\n\n一、报关单基本信息（照报关单逐字抄）\n  报关单号：【必填】____________　海关编号：____________\n  申报日期：______　出口日期：______　申报地海关：____________\n  报关行 / 申报单位：____________　报关员：____________\n  监管方式：【必填】□一般贸易(0110) □进料加工(0615) □其他 ________\n  征免性质：____________　结汇方式：____________\n  运输方式：____________　运输工具名称 / 航次：____________\n  提运单号：____________　集装箱号：____________\n▸新手提示：报关单号在订单「出货」栏也要回填一次。退税节点的放行条件读的就是那个字段，只登在这张表里，系统不认。\n\n二、商品项（一票多品时逐项登记）\n  填法：项号｜HS 编码｜中文品名｜规格型号｜申报数量 / 单位｜法定数量｜币制｜单价｜总价｜毛重(kg)｜净重(kg)｜原产国｜最终目的国\n  1 ｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____\n  2 ｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____\n  合计总价：________　合计毛重：______ kg　合计净重：______ kg\n\n三、随附单证\n  □合同　□商业发票　□装箱单　□报关委托书　□提（运）单\n  □原产地证　□出口许可证　□商检 / 熏蒸证明　□其他 ____________\n\n四、核对（逐项打勾，漏一项退税就可能卡住）\n  □ 报关单的品名 / 数量 / 金额与商业发票完全一致\n  □ 出口日期与提单开船日不矛盾\n  □ HS 编码与「单证表」里登记的一致\n  □ 成交方式 ________ 与合同一致\n  □ 退税联已收到\n  □ 报关单号已回填到订单「出货」栏\n\n★固定条款｜报关单号一经申报不得自行涂改；发现错误必须由申报单位向海关申请改单，并将改单原因与费用承担一并留档。\n▸新手提示：HS 编码写错是查验率最高的一类。抄的时候对着报关单一位一位核，不要凭记忆 —— 凭记忆一定会错一位。\n▸新手提示：纸质 / 电子报关单按「年份-报关单号」存档。税务核查时，这是第一批要调的资料。","sub":true,"step":"报关单证"},{"k":"ord:6#2","m":"ord","mn":"订单合同","s":6,"n":"货物申报要素信息表","sc":"sup","lay":"form","d":"报关行每次都会问的那一串信息。一个产品填一次、存一份，以后每票货直接复制给报关行，不用每次现翻现编。","t":"【货物申报要素信息表】Item Declaration Elements\n报关行 / 接收方：____________　填表日期：______\n本表编号：ELM-______　产品编号 / SKU：____________\n▸新手提示：申报要素每次现编，一定会出现两次口径不一样。同一个产品第一次出口就把这张表填好存起来。\n\n一、产品识别\n  中文品名：【必填】____________　英文品名：____________\n  HS 编码（10 位）：【必填】____________　退税率：______%\n  规格型号：____________\n  品牌类型：□无品牌　□境内自主品牌　□境内收购品牌　□境外品牌(贴牌)　□境外品牌(其他)\n  品牌名称：____________（无品牌填 N/M）\n\n二、材质与成分\n  材质：【必填】____________（例：100% 棉 / ABS+PC / 304 不锈钢）\n  成分含量：____________（例：棉 100% / ABS 60% PC 40%）\n  是否含濒危动植物成分：____________\n\n三、用途与功能\n  用途：【必填】____________（例：家用 / 工业用 / 汽车配件）\n  功能 / 工作原理：____________\n  加工方法：____________\n\n四、包装与规格\n  包装种类：【必填】____________（例：纸箱 / 托盘 / 编织袋）\n  每箱装量：______　单件净重 ______ kg　单件毛重 ______ kg　单件体积 ______ CBM\n  是否零售包装：□是　□否\n\n五、其他申报要素\n  是否含 GTIN：____________（有则填码，无则填\"无\"）\n  是否为成套货物：□是　□否\n  是否有附件 / 配件：____________\n  生产厂家名称：____________　统一社会信用代码：____________\n\n六、关联与签章\n  关联报关单号：____________（一票报关单对应一份要素表，便于日后调档）\n  申报单位（盖章）：____________　经办人签字：____________　日期：______\n\n★固定条款｜申报要素必须与实际货物、商业发票、报关单完全一致。伪报、瞒报申报要素构成走私，法律责任由申报单位与实际货主共同承担。\n▸新手提示：申报要素填错最常见的后果不是罚款，是查验 —— 一查就是 3 到 5 天，赶上截关日就是甩柜。\n▸新手提示：HS 编码和退税率要一起记。编码变了退税率可能跟着变，报错了少退的钱是自己的。\n▸新手提示：这份可以复制给报关行，但发之前确认一下别把成本价、客户名留在同一份文件里。","sub":true,"step":"报关单证"},{"k":"ord:6#3","m":"ord","mn":"订单合同","s":6,"n":"出口报关确认函","sc":"sup","lay":"letter","d":"报关行报完关、海关放行后，我方签字回传的确认件。作用是留一份「我方已确认放行、放行内容是什么」的书面记录，出事时用来界定责任。","t":"【出口报关确认函】EXPORT DECLARATION CONFIRMATION\n致 / To：____________（报关行 / 货代）\n关联订单号：____________　委托编号：____________　日期：______\n▸新手提示：这份函不签字盖章就只是一张纸。报关行要的是\"你确认放行\"这个动作。\n\n一、你方申报内容（据你方回传的报关单填写）\n  报关单号：____________　申报日期：______　放行日期：______\n  出口日期：______　监管方式：____________\n  品名 / 数量 / 金额：____________ / ________ / ________\n  集装箱号：____________　封条号：____________\n  是否查验：□否　□是（查验方式 ____________，结果 ____________）\n\n二、我方确认（已核对以下各项）\n  □ 报关单号、出口日期与我方记录一致\n  □ 品名 / 数量 / 金额与商业发票一致\n  □ HS 编码与申报要素信息表一致\n  □ 成交方式 ________ 与合同一致\n  □ 退税联已收到\n\n三、待办与遗留（这一栏最有价值，别空着）\n  □ 退税联未收，预计 ______ 前补寄\n  □ 需改单：项目 ____________　原因 ____________　改单费用由 ______ 承担\n  □ 无遗留事项\n\n★固定条款｜1. 本函仅确认上述申报内容与我方记录一致，不构成对申报行为合法性的担保；申报行为由申报单位依《海关法》独立承担责任。2. 本函出具后发现申报内容有误的，我方应在 1 个工作日内书面通知你方，并按海关规定申请改单。\n▸新手提示：第 3 节\"待办与遗留\"是最容易被写空、也最该写实的一栏。退税联没收到就在这里写清楚 —— 别嘴上说一句就过去，三个月后没人记得是谁答应的。\n▸新手提示：要改单的，务必在函里写明费用谁承担。改单费用通常不小，事后再谈就谈不动了。\n\n报关行签章：____________　我方签字 / 盖章：____________　日期：______","sub":true,"step":"报关单证"},{"k":"ord:6#4","m":"ord","mn":"订单合同","s":6,"n":"原产地证申领表（CO / FORM E / FORM A）","sc":"sup","lay":"form","d":"客户减免关税全靠这张证。缺了它客户一定回来要，而且往往是在货已经到港清不了关的时候才来要。","t":"【原产地证申领表】Certificate of Origin Application\n申领机构：□贸促会 CCPIT □海关 □其他 ____________　申请日期：______\n▸新手提示：FORM E 是中国—东盟自贸区专用的，能给客户降的税最多。出货前先问客户要哪种 —— 等货到港再问，滞港费比证贵得多。\n\n一、证书种类（三选一，勾错等于白办）\n  □ CO（一般原产地证）\n  □ FORM E（中国—东盟自贸区）\n  □ FORM A（普惠制，仅部分给惠国仍接受）\n  □ 其他：____________（例：RCEP / 中韩 / 中澳）\n\n二、Exporter 出口商（须与发票、报关单一致）\n  名称 / 地址：____________\n  统一社会信用代码：____________\n\n三、Consignee 收货人（须与提单 Consignee 一致）\n  名称 / 地址：____________　国家 / 地区：____________\n\n四、Goods 商品信息\n  中文品名：【必填】____________　英文品名：____________\n  HS 编码（6 位即可）：【必填】____________\n  数量 / 单位：________ / ________　毛重：______ kg\n  发票号：【必填】____________　发票金额：________　发票日期：______\n  原产地标准：□完全获得 □含进口成分（百分比 ______%）\n▸新手提示：HS 编码各国海关要求位数不同，申领前按目的国要求确认。填错一位，客户的关税优惠就作废。\n\n五、Transport 运输信息\n  装运港：____________　目的港：____________\n  运输方式：□海运 □空运 □陆运　船名 / 航次：____________\n  出运日期：______　提单号：____________\n\n六、申领与签章\n  申领份数：正本 ______ 份　副本 ______ 份\n  申领单位（盖章）：____________　经办人签字：____________\n  申领日期：______　证书编号（出证后回填）：____________\n\n★固定条款｜1. 本表所填内容须与商业发票、装箱单、报关单完全一致，任一处不一致均可能导致证书被拒签或在目的港无法享惠。2. 原产地标准须如实申报，虚报原产地构成骗取出入境证件，由申领单位承担全部法律责任。3. 证书签发后内容不得自行涂改，需变更的应向原签发机构申请重发。\n▸新手提示：证书拿到手先扫一份存电脑，再把纸质正本单独寄给客户。只寄一次、客户说没收到，重办要重新缴费。","sub":true,"step":"报关单证"},{"k":"ord:6#5","m":"ord","mn":"订单合同","s":6,"n":"货物运输保险投保单","sc":"sup","lay":"form","d":"CIF 由我方投保时用。保险金额通常按发票金额 ×110% 投保，少保那 10% 就是货损时自己贴的钱。","t":"【货物运输保险投保单】Marine Cargo Insurance Application\n保险公司 / 代理：____________　投保日期：【必填】______\n▸新手提示：CIF 成交时投保是**我方义务**，不是可选动作。忘了投保，货物出险后要自己承担全部损失。\n\n一、Parties 主体\n  投保人（Applicant）：____________\n  被保险人（Insured）：□我方 □客户（按信用证 / 合同要求）____________\n  赔款偿付地点（通常与目的港一致）：____________\n\n二、保险金额\n  发票金额：【必填】________　币种：□USD □EUR □RMB\n  投保加成：110%（默认）□其他 ______%\n  保险金额：【必填】________（＝ 发票金额 × 加成）\n▸新手提示：加成不是保险公司乱收的。那 10% 是预期利润，不加成的话货损时只赔成本，利润自己吞。\n\n三、Coverage 险别\n  □ 平安险 FPA　□ 水渍险 WPA　□ 一切险 All Risks\n  □ 附加：□战争险 □罢工险 □碰损破碎险 □其他 ____________\n  适用条款：□CIC（中国保险条款）□ICC（伦敦协会条款）\n\n四、Shipment 运输信息\n  发票号 / 合同号：____________　提单号：____________\n  运输工具（船名 / 航次）：____________\n  起运地：____________　中转地：____________　目的地：____________\n  开航日期：______　预计到达：______\n  包装与件数：______ ctn　毛重：______ kg\n\n五、特别约定\n  □ 仓至仓条款 Warehouse to Warehouse\n  □ 免赔额：____________\n  其他约定：____________\n\n六、投保与签章\n  保费：________　保单号（出单后回填）：____________\n  投保人（盖章）：____________　经办人签字：____________　日期：______\n\n★固定条款｜1. 投保单所填内容须与商业发票、提单一致；申报不实影响赔付的，由投保人自行承担后果。2. 保险责任以保单签发并收取保费之日起成立，投保单本身不构成保险合同的成立。3. 保险金额低于发票金额 110% 的，超额损失部分由投保人自行承担。\n▸新手提示：保单出来后第一时间核对三件事 —— 被保险人、保险金额、目的港。这三处错得最多，而且出险前没人会发现，出险后保险公司按错的那份拒赔。","sub":true,"step":"报关单证"},{"k":"ord:6#6","m":"ord","mn":"订单合同","s":6,"n":"装船通知 Shipping Advice","sc":"out","lay":"letter","d":"CIF / CFR 成交时，装船后必须立刻发给客户。这封信不发，出现货损保险公司可以拒赔 —— 因为客户无从投保、也无从准备收货。","t":"SHIPPING ADVICE\n▸Tip: Under CIF this notice carries legal weight — our insurance obligation is discharged only when the shipping advice is sent. One day late is one more day of risk carried by us.\n\nDate: ______　　Our Ref.: SO-______\nTo: ____________ (Company)　　Attn: ____________\n\nDear ________,\n\nWe are pleased to inform you that the following goods have been shipped. Please find the details below:\n\n  Order / Contract No.: ________\n  Invoice No.: ________　　Packing List No.: ________\n  B/L No.: ________　　Booking No.: ________\n  Vessel / Voyage: ________ / ________\n  Port of Loading: ________　　Port of Discharge: ________\n  ETD: ______　　ETA: ______\n  Container / Seal No.: ________ / ________\n  No. of Packages: ______ ctn　　Gross Weight: ______ kg　　Volume: ______ CBM\n  Insurance Policy / Certificate No.: ________ (mandatory under CIF)\n\nPlease arrange to take delivery and, where applicable, to lodge any claim with the insurer promptly.\n\n★Standard notes｜1. This advice is issued on ________ (trade term) terms; risk in the goods passes to the buyer when the goods are loaded on board at the port of shipment. 2. The buyer shall inspect the goods before taking delivery; where loss or damage is found, a claim shall be lodged with the insurer within the period stipulated in the insurance policy, and the evidence on site shall be preserved. 3. The contents of this advice are subject to the original bill of lading and commercial invoice; in case of discrepancy, the original documents shall prevail.\n▸Tip: Send it as soon as ETD is confirmed — do not wait for departure, still less for the buyer to ask. The buyer needs this letter to arrange his agent, warehouse and insurance.\n▸Tip: On CIF orders, fill in the insurance policy number. Without it the buyer does not even know who to claim from.","sub":true,"step":"报关单证"},{"k":"ord:6#7","m":"ord","mn":"订单合同","s":6,"n":"MSDS 与危险品 / 木质包装声明","sc":"mixed","lay":"mixed","d":"化工品、带电池、带液体的货必备 MSDS；木箱 / 木托盘包装必须有 IPPC 熏蒸标识。缺了不是罚款的问题，是货上不了船、到了港也清不了关。","t":"【MSDS 与包装声明】MATERIAL SAFETY DATA SHEET & PACKING DECLARATION\n产品名称：【必填】____________　型号：____________　填表日期：______\n▸新手提示：是不是危险品，不由你我说了算 —— 由 MSDS 和鉴定报告说了算。凭经验判断\"这个应该不算\"，被查出来就是瞒报。\n\n一、货物属性判定\n  是否化工品 / 含化学成分：□否 □是（主要成分：____________）\n  是否含锂电池 / 蓄电池：□否 □是（类型 ____________，容量 ______ Wh）\n  是否含液体 / 气体 / 粉末：□否 □是（____________）\n  是否磁性 / 含压力容器：□否 □是\n  判定结论：【必填】□非危险品 □危险品（UN 编号 ____________，类别 ______）\n  判定依据：□MSDS □第三方鉴定报告（编号 ____________，出具机构 ____________）\n\n二、MSDS 要素（十六项，缺项船公司与海关会退件）\n  □ 1 产品与厂商信息　□ 2 成分信息　□ 3 危险性概述　□ 4 急救措施\n  □ 5 消防措施　□ 6 泄漏应急处理　□ 7 操作与储存　□ 8 暴露控制\n  □ 9 理化特性　□ 10 稳定性与反应性　□ 11 毒理学信息　□ 12 生态学信息\n  □ 13 废弃处置　□ 14 运输信息（含 UN 号与包装类别）□ 15 法规信息　□ 16 其他\n  MSDS 版本日期：______　语言：□中英对照 □英文 □中文\n\n三、木质包装声明（IPPC）\n  木质包装：□无（全部为纸箱 / 塑料 / 金属）□有\n  有木质包装时必填：\n    材料：□木箱 □木托盘 □木条　处理方式：□热处理 HT □熏蒸 MB □其他 ______\n    IPPC 标识是否清晰可见：□是 □否（无标识的木质包装会被目的港退运或销毁）\n    处理证书编号：____________　出具机构：____________\n\n四、其他包装声明\n  □ 货物中不含任何隐藏的危险品\n  □ 包装符合所采用运输方式的要求\n  □ 无土壤、种子、树皮等检疫禁止物（木包装已处理）\n\n=== 以下为对外发客户的正式函件 ===\n\nPACKING DECLARATION（包装声明）\n\nDate：______　　Our Ref.：SO-______\nTo：____________ (Company)\n\nDear Sir / Madam,\n\nWe hereby declare that the goods under the above order are packed as follows:\n\n  Packing material：□ carton  □ wooden case / pallet (IPPC treated, cert. no. ________)  □ other：________\n  The goods are：□ non-dangerous  □ dangerous (UN ________, class ________)\n  No hidden dangerous goods are contained in the shipment.\n\n★固定条款｜1. 本声明所载货物属性与包装情况须与实际货物完全一致；虚报、瞒报危险品构成违法行为，由此产生的罚款、退运、销毁及第三方索赔由申报方承担。2. 含木质包装的，须带有清晰可辨的 IPPC 标识并随附处理证书；无标识或标识不清的木质包装将在目的港被退运或销毁，费用与风险由发货人承担。3. MSDS 须为最新版本且涵盖十六项要素，内容与实际货物不符的，船公司有权拒绝承运。\n▸新手提示：带电池的货最容易被卡。哪怕是很小的纽扣电池，也要如实申报 —— 被查出瞒报，罚款之外还会被列入黑名单，后续出货全部严查。\n▸新手提示：木质包装没有 IPPC 标识，目的港通常的处置是**整柜退运或销毁**，费用比货值还高。用木托盘之前先确认供应商有没有处理证书。","sub":true,"step":"报关单证"},{"k":"ord:7","m":"ord","mn":"订单合同","s":7,"n":"清关单证清单","sc":"in","lay":"form","d":"单证不齐客户在目的港清不了关，会产生滞港费，责任在我们。","t":"【清关单证清单】SO-______\n▸新手提示：这份清单的每勾一个，都要留下\"已寄出\"的证据。单证不齐导致的滞港费比单证本身的成本高得多。\n\n订单号：SO-______　目的港：____________　客户要求到港日：______\n────────────────────────────────────────\n单证名称｜份数｜单号/编号｜签发日｜已寄出｜寄送方式｜快递单号\n商业发票 Commercial Invoice｜__｜________｜____｜□｜______｜______\n装箱单 Packing List｜__｜________｜____｜□｜______｜______\n提单 B/L（□正本 □电放）｜__｜________｜____｜□｜______｜______\n产地证 CO / FORM E（如需）｜__｜________｜____｜□｜______｜______\n质量 / 检测报告（如需）｜__｜________｜____｜□｜______｜______\n保险单（如需）｜__｜________｜____｜□｜______｜______\n其他：____________｜__｜________｜____｜□｜______｜______\n────────────────────────────────────────\n客户是否需要电放：【必填】□否 □是（确认日期 ______）\n电放是否已办理：□否 □是（日期 ______）\n单证寄出日：______\n客户清关联系人 / 电话：____________\n▸新手提示：电放权在客户手上。收了尾款再去要电放申请；没收款不要给电放，这是唯一的筹码。\n\n异常记录：____________________________________","sub":false,"step":"清关交付"},{"k":"ord:7#1","m":"ord","mn":"订单合同","s":7,"n":"电放申请书 Telex Release Application","sc":"sup","lay":"form","d":"把正本提单改成电放，等于把货权提前交给客户 —— 这是尾款最重要的筹码，放之前一定确认钱已到账。","t":"【电放申请书】TELEX RELEASE APPLICATION\n致（船公司 / 货代）：____________　申请日期：【必填】______\n▸新手提示：电放之前只问一句：**尾款到账了吗？** 电放一放，货权就归客户了，再催款就没有筹码了。\n\n一、提单信息\n  提单号 B/L No.：【必填】____________　签发份数：______ 份正本\n  船名 / 航次：____________　开航日 ETD：______\n  装运港：____________　目的港：____________\n  柜号 / 封条号：____________ / ____________\n  收货人 Consignee：____________\n\n二、货物信息\n  品名：____________　件数：______ ctn　毛重：______ kg\n  发票号：____________　发票金额：________\n\n三、申请事项\n  □ 申请电放（Surrender / Telex Release）\n  □ 申请海运单（Seaway Bill）\n  申请理由：□尾款已收清 □长期合作客户，经批准 □信用证项下 □其他 ____________\n\n四、放货前确认（逐项打勾，缺一项不得申请）\n  □ 尾款 / 全部货款已到账（金额 ________，到账日 ________）\n  □ 客户已书面确认无需正本提单\n  □ 正本提单 ____ 份已全部交回 / 作废；无法交回的已说明原因 ____________\n  □ 已取得另一名成员书面同意（未收清货款的必须有）\n\n五、承诺与签章\n  我司承诺：因本次电放产生的一切责任、风险与费用（包括但不限于错误放货、重复提货、第三方索赔）均由我司承担，与贵司无关。\n  申请单位（盖章）：____________　负责人签字：____________\n  联系电话 / 邮箱：____________　日期：______\n\n★固定条款｜1. 电放一经办理即不可撤销，货物所有权自电放指令生效时转移，申请人不得以任何理由要求恢复正本提单。2. 申请人须确认全部货款已收讫；未收讫即申请电放的，由此造成的货款损失由申请人自行承担。3. 因电放导致的错误放货、无单放货及第三方索赔，由申请人承担全部责任并赔偿承运人损失。\n▸新手提示：正本提单如果已经寄出去了，一定要先追回再办电放。提单在别人手里又办了电放，等于两份提货权同时在外流通 —— 这是最容易出大事故的一种情况。","sub":true,"step":"清关交付"},{"k":"ord:8","m":"ord","mn":"订单合同","s":8,"n":"收汇核销单 / 对账单 / 收款确认函","sc":"mixed","lay":"mixed","d":"到账金额与应收不符要立刻查清（手续费 / 汇率 / 少付），不能糊过去。下方附可直接发客户的收款确认函。","t":"【收汇核销单】SO-______\n▸新手提示：到账比应收少一分钱都要查清楚。糊过去的话，下次客户少付你根本发现不了。\n\n一、应收应付\n  订单应收总额：________\n  定金：________　尾款：________\n  累计已收：________　　未收：【必填】________\n────────────────────────────────────────\n二、本次收汇\n  收汇日期：______\n  收汇金额：________\n  银行手续费：________\n  实际到账净额：________　（公式：收汇金额 − 手续费）\n  银行水单号：____________　　汇率：1 USD = ¥ ______\n  已转余款抵订单：□是 □否\n────────────────────────────────────────\n三、差异说明（如有必填）\n  原因：□银行手续费 □汇率差 □客户少付 □其他 ______\n  金额差：________\n  处理动作：______________________________\n  是否已向客户追讨：□否 □是（日期 ______，方式 ______）\n────────────────────────────────────────\n四、核销结论\n  核销后状态：【必填】□部分收款 □已收清\n  未收金额：________（勾「已收清」时必须为 0）\n  外汇核销 / 退税是否已办理：□否 □是（日期 ______）\n  经办人：______　日期：______　复核人：______\n  制单人签字：____________　复核人签字：____________\n  公司盖章：______________________　核销日期：______\n\n五、汇差算例（照这个算，别让汇率差糊过去）\n  订单应收 USD 20000（尾款已收清）\n  收汇金额 USD 20000、银行手续费 USD 40 → 实际到账净额 USD 19960\n  结汇汇率 7.10 → 结汇人民币 20000 × 7.10 = 142000\n  若按报价时汇率 7.25 算应是 145000 —— 汇率一口吃掉 3000 人民币，\n  这就是「差异说明」里勾「汇率差」的那 3000：不体现在毛利率上，\n  但实打实吃掉人民币利润。水单号与结汇汇率当天登记，别攒到月底。\n\n=== 以下为对外发客户的正式函件 ===\n\nPAYMENT CONFIRMATION\n\nDate：______　　Our Ref.：SO-______\nTo：____________ (Company)　　Attn：____________\n\nDear ________,\n\nThank you for your payment. We confirm receipt of your payment for order ______ as follows:\n\n  Invoice No.：________\n  Amount Received：________\n  Value Date：______\n  Our Reference No.：________\n\nThe outstanding balance of this order is now ________, which is payable by ______ (due date).\n\n★固定条款｜1. 收到款项以我方银行实际入账为准，中转行扣费造成的差额由付款方承担。2. 款项入账后我方将出具收据；如需形式发票收据请书面告知。\n▸新手提示：这封函不是客套，是留痕。银行入账后当天发，客户日后争议\"我付过了\"时，这就是证据。\n\n=== 对账单 Statement of Account ===\nSTATEMENT OF ACCOUNT\nStatement No.：______　Date：______　　Customer：____________\nCurrency：________\n────────────────────────────────────────\nDate｜Invoice No.｜Description｜Amount Due｜Amount Paid｜Balance\n____｜________｜________｜________｜________｜________\n____｜________｜________｜________｜________｜________\n─────┬──────────────────────────────────\nTOTAL DUE：________\nPayment Terms：定金 ______% 于生产前，尾款 ______% 于装运前\n▸新手提示：对账单一并发给客户，能显著减少\"以为付过了\"的争议。同时留一份自己存档。","sub":false,"step":"收汇结算"},{"k":"ord:8#1","m":"ord","mn":"订单合同","s":8,"n":"汇款水单登记与核对表","sc":"in","lay":"form","d":"客户打款后把水单（汇款证明）登记进来，逐项核对到账金额。收汇核销和退税都要求「收汇已核销」，水单是唯一凭据。","t":"【汇款水单登记与核对表】关联订单 ______\n▸新手提示：水单是收汇的唯一凭据。收到当天就登记，不要等月底对账时一起补 —— 补的时候就记不清是哪笔了。\n\n一、水单信息（照客户提供的水单 / 银行入账通知抄）\n  付款方名称：【必填】____________（须与合同买方一致）\n  付款银行 / 国家地区：____________\n  汇款日期：______　到账日期：______\n  汇出金额：________　　汇出币种：____________\n  入账金额：________　　入账币种：____________\n  差额（汇出 - 入账）：____________（自动计算）\n  结算币种：□USD □EUR □CNY □其他 ______\n  水单号 / 报文号：____________　银行 / 经办人：____________\n  汇款附言（客户备注的合同号 / 订单号）：____________\n▸新手提示：付款方和合同买方不一致的，一定要拿到买方书面说明再确认收款。第三方代付在退税环节是重点核查项。\n\n二、到账核对\n  本单应收：________　本单累计已收：________\n  本次款项性质：□定金（应收 ______%）□尾款（应收 ______%）□全额　□样品费\n  差额归属：□我方承担  □客户承担  □已向客户说明并同意\n  结汇汇率：______　结汇金额（RMB）：________\n▸新手提示：发票金额与到账金额不一致，绝不能默认\"差额就是手续费\"就算了。先查清是手续费、汇率还是少付；查不清就书面问客户。\n\n三、一致性核对（逐项打勾）\n  □ 水单上的付款方与合同买方一致\n  □ 水单附言里的合同号 / 订单号与本单一致（不一致必须书面确认，不能默认）\n  □ 到账金额与应收金额一致，或差额已说明\n  □ 本次收汇已回填订单「收汇日期 / 收汇金额 / 水单号 / 结汇汇率」\n  □ 该笔已计入「收汇核销」\n\n四、第三方代付（如有）\n  实际付款方：____________　与买方关系：____________\n  □ 有买方书面授权　□ 无买方书面授权（无授权不得确认收款）\n  □ 已完成受制裁国家 / 地区筛查，无异常\n  □ 本单无第三方代付\n\n★固定条款｜1. 水单仅为到账线索，收汇以我方银行实际入账金额为准。2. 客户提供的付款方与合同买方不一致的，必须取得买方书面说明后方可确认收款；否则可能构成第三方代付，影响收汇核销与出口退税。3. 水单原件须存档，保存期不少于 5 年。\n▸新手提示：水单要留能看清付款方、金额、日期的原件（银行回单或客户水单截图都行）。税务核查时只认原件，看不清的一律不算。","sub":true,"step":"收汇结算"},{"k":"ord:8#2","m":"ord","mn":"订单合同","s":8,"n":"信用证审证表（收到 L/C 先审后做）","sc":"in","lay":"form","d":"L/C 一到手就审，不要等到备货完才看。信用证是单据交易，条款里任何一条做不到，银行就有理由拒付 —— 而货已经发走了。","t":"【信用证审证表】L/C CHECKLIST\nL/C 编号：【必填】____________　开证行：____________　开证日：______\n▸新手提示：最晚交单期和有效期是两个日子，别看混。过了交单期，银行拒付，货和钱两头空。\n\n一、四个关键日期（错一个就是不符点）\n  信用证有效期：【必填】______（到期地点：□我方所在地 □开证行所在地）\n  最迟装船日：【必填】______　我们能否做到：□能 □不能\n  最晚交单期：【必填】______（交单不得晚于此日，且不得晚于信用证有效期）\n  通常为装船后 ______ 日内交单 —— 与最迟装船日一起核对，两个日子要能同时做到\n  交单地点：____________\n\n二、金额与币种\n  信用证金额：【必填】________　币种：【必填】________\n  与合同 / PI 金额是否一致：□一致 □不一致（差额 ______，原因 ____________）\n  是否允许分批装运：□允许 □不允许　是否允许转运：□允许 □不允许\n  溢短装：□无 □±______%\n\n三、单据要求（逐项核对，缺一份就拒付）\n  □ 商业发票（份数 ______，是否需签署/认证 ______）\n  □ 装箱单（份数 ______）\n  □ 提单（□全套正本 □____ 份；Consignee 抬头要求：____________）\n  □ 原产地证（种类 ______，签发机构 ______）\n  □ 保险单（CIF 时；投保加成 ______%，险别 ____________）\n  □ 检验证书（□我方出具 □第三方 ______ □客户指定 ______）\n  □ 受益人证明 □ 装船通知副本 □ 其他：____________\n\n四、软条款排查（这几条出现一条就要警惕）\n  □ 要求\"开证行另行通知才能装运\"→ 不接受，必须删改\n  □ 要求提交\"客户签署的检验证书\"→ 主动权在对方，必须删改\n  □ 要求\"正本提单直接寄开证申请人\"→ 货权丢失，必须删改\n  □ 信用证在开证行所在地到期 → 交单时间不可控，要求改到我方所在地\n  □ 本证受 UCP600 约束：□是 □否（不是的话要特别当心）\n\n五、审证结论\n  结论：【必填】□可直接执行 □需改证（改证申请编号 ______）□不可接受，须重开\n  需修改条款清单：______________________________\n  审证人：______　复核人：______　日期：______\n\n★固定条款｜1. 信用证项下银行处理的仅是单据而非货物，任何单据不符点均可构成拒付理由，与货物是否合格无关。2. 本表所列软条款一经接受，即丧失对货权与装运的主动权，须在改证后方可安排生产。3. 审证结论为\"需改证\"的，在收到开证行修改通知书之前不得安排装运。\n▸新手提示：改证要趁早。越临近装船，改证越容易误了船期；而且改证费通常是我方承担。\n▸新手提示：「客户签署的检验证书」是最典型的软条款 —— 客户不签，你永远交不了单。","sub":true,"step":"收汇结算"},{"k":"ord:8#3","m":"ord","mn":"订单合同","s":8,"n":"信用证改证申请书","sc":"sup","lay":"form","d":"审证发现做不到的条款，必须书面要求开证申请人改证。改证要在装船前完成，改证费通常我方承担。","t":"【信用证改证申请书】L/C AMENDMENT REQUEST\n致（开证申请人）：____________　申请日期：【必填】______\nL/C 编号：【必填】____________　合同号：____________\n▸新手提示：改证申请一定要落到书面（邮件即可），并请对方书面确认已向开证行申请。口头答应没用，开证行没收到改证申请，原条款依然有效。\n\n一、申请修改事项（逐条写清\"原文 → 改为\"）\n  修改 1：原条款 ______________________________\n          修改为 ______________________________\n  修改 2：原条款 ______________________________\n          修改为 ______________________________\n  修改 3：原条款 ______________________________\n          修改为 ______________________________\n\n二、修改原因\n  □ 交期做不到（说明 ____________）　□ 单据无法取得（说明 ____________）\n  □ 存在软条款，我方无法控制（说明 ____________）\n  □ 与合同 / PI 不一致（说明 ____________）\n  □ 其他：______________________________\n\n三、费用与时间\n  改证费承担：□我方 □开证申请人　预计金额：________\n  最迟需在本日之前完成改证：【必填】______（晚于此日将影响装船）\n\n四、签章\n  申请单位（盖章）：____________　经办人：____________　日期：______\n  对方书面确认收到：□已确认（日期 ______，方式 ______）□未确认\n\n★固定条款｜1. 信用证修改须经开证行发出修改通知书并为我方接受后方生效，开证申请人的口头或书面同意不构成修改。2. 我方对修改通知书须作出接受或拒绝的明确表示，沉默不构成接受。3. 在修改生效前，原信用证条款对各方仍具约束力。\n▸新手提示：改证通知书到了之后，要么明确接受、要么明确拒绝，不能\"不表态\"。部分接受是不允许的 —— UCP600 下修改只能整体接受或整体拒绝。","sub":true,"step":"收汇结算"},{"k":"ord:8#4","m":"ord","mn":"订单合同","s":8,"n":"信用证交单清单（议付/承兑用）","sc":"sup","lay":"form","d":"交单前逐项清点。银行是按单据付款的，少一份、错一处，就是一次拒付 —— 拒付一次，货款至少晚一个月。","t":"【信用证交单清单】DOCUMENTS PRESENTATION CHECKLIST\nL/C 编号：【必填】____________　交单日期：【必填】______　交单银行：____________\n我方编号（BP/议付编号）：____________\n▸新手提示：交单清单一式两份，银行留一份、自己留一份。将来真被拒付，要能说清\"当时交了什么\"。\n\n一、单据清单（与信用证要求逐条对照后打勾）\n  填法：单据名称｜份数｜编号/号码｜签发日｜与 L/C 要求是否一致｜备注\n  1 ｜____｜____｜____｜____｜____\n  2 ｜____｜____｜____｜____｜____\n  3 ｜____｜____｜____｜____｜____\n  4 ｜____｜____｜____｜____｜____\n  5 ｜____｜____｜____｜____｜____\n\n二、交单前必查（不符点高发区）\n  □ 发票金额与信用证金额一致（含溢短装的在允许范围内）\n  □ 发票上的货物描述与信用证**逐字**一致\n  □ 提单的 Consignee / Notify 与信用证要求一致\n  □ 提单已按要求背书（□空白背书 □记名背书 ________）\n  □ 保险单的投保加成不低于信用证要求（通常 110%）\n  □ 各单据之间的件数 / 毛重 / 体积完全相符\n  □ 所有需要签署的单据都已签署\n  □ 在交单期内（最晚交单日 ______）且未过信用证有效期\n\n三、金额与收汇\n  本次交单金额：【必填】________　币种：________\n  银行费用：________　预计入账净额：________\n  收汇方式：□议付 □承兑（到期日 ______）□付款\n\n四、签署\n  制单人：______　复核人：______　日期：______\n  银行签收：____________　签收日期：______\n\n★固定条款｜1. 交单单据须符合信用证条款及 UCP600 的规定，任何不符点均可能导致开证行拒付，且拒付与货物实际状况无关。2. 交单后如需退单修改，须经开证行同意并承担由此产生的费用与时间损失。3. 本清单一式两份，一份随单交银行，一份由我方留存备查。\n▸新手提示：发票上的货物描述要和信用证\"一字不差\"。多写一个词、少写一个空格都可能被挑不符点 —— 这不是银行刁难，是单据交易的游戏规则。","sub":true,"step":"收汇结算"},{"k":"ord:8#5","m":"ord","mn":"订单合同","s":8,"n":"托收交单委托书（D/P · D/A）","sc":"sup","lay":"form","d":"D/P 是付款交单、D/A 是承兑交单。D/A 意味着客户先拿到单、后付款 —— 等于赊销，只有老客户且信用良好才用。","t":"【托收交单委托书】COLLECTION ORDER\n致（托收行）：____________　委托日期：【必填】______\n▸新手提示：D/A（承兑交单）客户只要签个字就能把货提走，钱要到期才付 —— 这是赊销，不是收款。只有合作多年、信用良好的客户才用。\n\n一、交单条件\n  方式：【必填】□D/P at sight（付款交单）□D/P after ______ 天 □D/A ______ 天\n  托收金额：【必填】________　币种：________\n  是否允许分批付款：□不允许 □允许　是否需拒绝证书（protest）：□不需要 □需要\n\n二、当事人\n  委托人（我方）：____________\n  付款人（客户）：____________　地址：____________\n  代收行：____________（客户所在地银行，SWIFT：____________）\n\n三、随附单据\n  □ 汇票（份数 ______，期限 ______）　□ 商业发票（______ 份）\n  □ 装箱单（______ 份）　□ 提单（____ 份正本，抬头 ____________）\n  □ 原产地证　□ 保险单　□ 其他：____________\n\n四、特别指示（不写清楚，代收行按自己的惯例办）\n  □ 费用由付款人承担；付款人拒付时由委托人承担\n  □ 不得放弃利息 / 费用\n  □ 需要代收行在拒付时做成拒绝证书\n  □ 提单不得在付款 / 承兑前放单\n  □ 拒付时货物处理方式：□原地仓储并投保 □退运 □转卖（需我方书面同意）\n\n五、签章\n  委托单位（盖章）：____________　经办人签字：____________　日期：______\n\n★固定条款｜1. 托收属商业信用，银行仅代为收款，不承担付款责任；付款人拒付或承兑后到期不付的，风险由委托人自行承担。2. D/A（承兑交单）项下单据在付款人承兑后即行释放，委托人须自行评估付款人信用风险。3. 代收行按本委托书指示办理；指示不明的，代收行按所在地惯例处理，后果由委托人承担。\n▸新手提示：托收没有信用证那样的\"银行信用\"兜底。客户不要货就是不要货，货已经在目的港，退运的成本常常比货值还高。","sub":true,"step":"收汇结算"},{"k":"ord:9","m":"ord","mn":"订单合同","s":9,"n":"出口退税申报跟踪表","sc":"in","lay":"form","d":"国家退的钱，不申报就是白丢。申报期限一过就补不回来。","t":"【出口退税申报跟踪表】SO-______\n▸新手提示：出口退税是公司实打实的现金流入。漏报不是\"少赚\"，是\"白丢\"。设好日历提醒，不要靠记性。\n\n一、申报依据（缺一不可）\n  报关单号：____________（退税联已收：□是 □否）\n  出口日期（报关单上的）：______\n  采购进项发票：已认证 □是 □否　发票号码：____________\n  收汇是否已核销：【必填】□是 □否（未核销一般不能申报）\n\n二、申报金额\n  采购成本（不含税）：¥ ________\n  退税率：______%（以商品编码对应税率为准，常见 13%）\n  预计可退税额：¥ ________　（公式：采购成本 × 退税率）\n  实际申报金额：¥ ________\n\n三、申报与到账\n  退税系统申报日：______（与系统「出口退税申报日」一致）\n  申报批次号 / 受理号：____________\n  税务机关受理：□待受理 □已受理 □已复审\n  退税款到账日：______　到账金额：¥ ________\n\n四、时限提醒（最要命的一条）\n  出口之日：______　→ 申报截止：次年 4 月 30 日\n  距今剩：______ 天　（≤90 天必须处理，别拖）\n────────────────────────────────────────\n差异说明（申报额 ≠ 到账额时必填）：\n  ____________________________________________________\n经办人：______　复核人：______","sub":false,"step":"出口退税"},{"k":"ord:9#1","m":"ord","mn":"订单合同","s":9,"n":"进项发票（增值税专票）追踪台账","sc":"in","lay":"form","d":"出口退税能不能退到，命门在这张票上：发票没到、没认证、或与报关单对不上，税就退不回来。一票一追踪，别等到申报期才发现缺票。","t":"【进项发票（专票）追踪台账】\n▸新手提示：退税申报有期限（报关出口之日起至次年 4 月 30 日前的各申报期）。票没到、没认证，期限一到这笔退税就彻底没了 —— 而这张票的成本已经付给供应商了。\n\n订单号：SO-______　出口报关单号：____________　出口日期：______\n退税申报批次：____________　申报截止日：______\n\n一、进项发票逐票登记\n  填法：项号｜供应商｜采购合同号｜专票号码｜开票日期｜金额(不含税)｜税率%｜税额｜认证日期｜认证状态｜对应出口报关单号\n  1 ｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____\n  2 ｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____\n  3 ｜____｜____｜____｜____｜____｜____｜____｜____｜____｜____\n  合计金额（不含税）：________　合计税额：________\n\n二、票证一致性核对（退税核查必看）\n  □ 发票上的品名与出口报关单的品名能对上（名称可不同，但必须是同一货物）\n  □ 发票金额与采购合同、付款金额一致\n  □ 供应商与采购合同、付款对象一致（不一致＝票货分离，退税高风险）\n  □ 发票已在增值税发票综合服务平台勾选认证\n  □ 发票开票日期早于退税申报日期\n\n三、缺票 / 异常追踪\n  缺票供应商：____________　缺票金额：________　催票日期：______\n  异常类型：□未开票 □已开票未寄到 □已到票未认证 □开票信息有误需重开 □供应商走逃失联\n  处理动作：______________________________\n  责任人：____________　预计解决日：______\n\n★固定条款｜1. 进项发票的品名、金额、供应商须与采购合同及付款记录相互对应，票货分离或不对应的不得用于退税申报。2. 发票须在规定期限内完成认证（勾选），逾期未认证的进项税额不得抵扣，亦不得作为退税依据。3. 供应商走逃、失联或开具异常凭证的，已退税款可能被追回，相关责任由经办人及审批人承担。\n▸新手提示：供应商\"开票要等下个月\"这种话不能信。催票要落在纸面上 —— 催票日期、对方承诺日期、责任人，三样都要有。\n▸新手提示：供应商失联是退税里最坏的一种情况，已经退的税会被追回。合作前查一下供应商的经营状态和纳税信用等级，成本很低。","sub":true,"step":"出口退税"},{"k":"ord:9#2","m":"ord","mn":"订单合同","s":9,"n":"出口退（免）税单证备案封面与目录","sc":"in","lay":"form","d":"税务要求出口企业把单证留存备案。没有这份封面和目录，备案就是一摞散纸，核查时说不清哪票是哪票。","t":"【出口退（免）税单证备案】封面与目录\n备案年度：______　备案编号：____________　装订日期：______\n▸新手提示：备案要按\"申报批次 + 报关单号\"归档。核查时税务是按批次调的，散着放一定找不到。\n\n一、封面信息\n  企业名称：____________　纳税人识别号：____________\n  备案所属期：______ 年 第 ______ 批次\n  本册共 ______ 票，报关单号自 ____________ 至 ____________\n  本册出口销售额合计：________　申报退税额合计：________\n  装订人：______　复核人：______　保管期限：______ 年（不少于 5 年）\n\n二、目录（逐票登记）\n  填法：序号｜报关单号｜出口日期｜出口销售额｜申报退税额｜备案单证是否齐全｜备注\n  1 ｜____｜____｜____｜____｜____｜____\n  2 ｜____｜____｜____｜____｜____｜____\n  3 ｜____｜____｜____｜____｜____｜____\n\n三、每票必备的备案单证（逐票打勾，缺一件就是备案不齐）\n  □ 出口货物报关单（退税联）\n  □ 商业发票　□ 装箱单\n  □ 提单 / 运单（或其他承运人出具的货物单据）\n  □ 采购合同 / 供货合同　□ 进项增值税专用发票（认证通过）\n  □ 收汇凭证（水单 / 结汇凭证）\n  □ 委托报关协议（委托报关时）\n\n四、自查\n  □ 各票单证的品名、数量、金额相互一致\n  □ 报关单号与退税申报表一一对应\n  □ 进项发票已认证，且供应商未走逃失联\n  □ 本册已按序号装订，页码连续\n\n★固定条款｜1. 出口企业须按规定将备案单证按顺序装订成册并妥善保存，保存期不少于 5 年；备案单证不齐或伪造的，已退税款应予追回。2. 本目录所列各票单证应与退税申报表逐项对应，任何一票缺失均构成该笔申报的备案缺陷。3. 备案单证不得涂改；需更正的应另行说明并留存更正依据。\n▸新手提示：核查时最常挑的就是\"进项发票没认证\"和\"供应商走逃\"。这两件事在装订前先自查一遍，比事后补救省事得多。","sub":true,"step":"出口退税"},{"k":"ord:10","m":"ord","mn":"订单合同","s":10,"n":"订单结案复盘表 / 售后沟通函","sc":"mixed","lay":"mixed","d":"关账后本单数据锁定。趁热把踩过的坑记下来，下一单才不会重犯。下方附对客户的售后函。","t":"【订单结案复盘表】SO-______\n▸新手提示：结案复盘不是为了交差，是为了把这单的坑变成下单的清单。写得越具体越有用。\n\n一、Result 结果\n  订单金额：________\n  成本合计：________\n  实际毛利：________　　实际毛利率：______%\n  是否达到 10% 毛利线：□是 □否（原因 ____________）\n  是否按时出货：□是 □否（延迟 ____ 天）\n  尾款是否收清：□是 □否（未收 ________，原因 ______）\n────────────────────────────────────────\n二、Problems 本单踩过的坑（必填，写具体）\n  1. ______________________________________________\n  2. ______________________________________________\n  3. ______________________________________________\n────────────────────────────────────────\n三、Reusable Lessons 可复用的经验 / 建议写进 SOP\n  ____________________________________________________\n────────────────────────────────────────\n客户复购可能性评估：□高 □中 □低\n客户档案是否已更新：□是 □否\n结案日期：______　结案人：______\n\n=== 以下为对外发客户的正式函件 ===\n\nAFTER-SALES SERVICE REQUEST / RESPONSE\n\nDate：______　　Our Ref.：SO-______\nTo：____________ (Company)　　Attn：____________\n\nDear ________,\n\nThank you for your order ______. We hope the goods have performed as expected.\n\nIssue reported\n  Description of issue：____________\n  Affected quantity / batch：____________\n  Photos or video attached：□Yes □No\n  Date the issue was first noticed：______\n\nOur proposed solution\n  □ Replacement of the affected goods in the next shipment\n  □ Credit note against your balance\n  □ Technical guidance / repair instruction\n  □ Replacement and recharge of the production cost\n\n★固定条款｜1. 品质异议须于货物到货后 7 日内以书面形式提出并附照片或视频证据；逾期视为接受。2. 质保范围限于产品质量问题，非质量原因或使用不当造成的损坏不在质保范围内。3. 任何解决方案均不构成对其他订单品质问题的承诺。\n▸新手提示：售后函必须严格卡 7 日异议期。这条不写进去，客户半年后翻出来一张模糊照片要全额退款，你基本没有还手余地。\n▸新手提示：先收证据再谈方案。回信第一句不要是\"我们很抱歉\"，先把问题描述复述一遍——这是把对方拉回事实。","sub":false,"step":"结案复盘"},{"k":"ord:10#1","m":"ord","mn":"订单合同","s":10,"n":"索赔回复函 Claim Reply Letter","sc":"out","lay":"letter","d":"客户提出索赔后的正式回复：受理还是不受理、调查结论、我方方案与赔付上限。口头答复不算数 —— 函里写「已受理」就等于把处理时限压在自己身上，写错一句后面全被动。","t":"CLAIM REPLY LETTER\nOrder No.: SO-______　Our Ref.: CR-______　Date: ______\nTo: ____________ (Company)　Attn: ____________\n▸Tip: Reply with this letter first — never answer orally with \"we will look into it\". Writing \"accepted\" puts the handling deadline on us; writing \"rejected\" must cite the contract or an inspection report. One wrong sentence and everything after is reactive.\n▸Tip: Agree the liability finding and the cap on compensation with a colleague before sending. What goes out is the company's position, not the handler's personal view.\n\n1. The Buyer's Claim (copy the claim letter word for word; do not reword the buyer's demand)\n  Buyer's claim ref. / date: ____________ / ______\n  Goods concerned: ____________　Quantity: ________\n  Amount claimed: 【必填】________ (currency ______)　Remedy sought: □Replacement □Price reduction □Return and refund □Repair □Other ______\n  Grounds stated by the buyer: ____________\n\n2. Decision on Acceptance 【必填】\n  □Accepted (investigation opened)　□Partly accepted (accepted: ____________; not accepted: ____________)\n  □Rejected (basis: □clause __ of the contract □third-party inspection report □claim raised after the agreed period □other ______)\n  Response deadline: investigation findings shall be given within ______ working days from the date of this letter\n\n3. Investigation Findings and Allocation of Liability\n  Method: □review of outgoing inspection and retained samples □third-party inspection (SGS / BV / TUV) □on-site check □other ______\n  Cause established: □our quality □factory production □packing / carriage □buyer's use or storage □attributable to neither party\n  Liable party: □us □factory □buyer □carrier / forwarder □shared (ratio ______)\n\n4. Our Proposal 【必填】\n  Proposal: □Replacement □Spare parts □Return and refund □Allowance □Free repair □Original decision stands (not accepted)\n  Allowance / compensation: ________ (currency ______)　Spare parts qty: ________　Expected completion: ______\n  Buyer's confirmation deadline: please confirm this proposal in writing before ______; otherwise it lapses automatically\n\n5. Follow-up\n  Next reply date: ______　Handler / contact: ____________\n\n★CLAIM HANDLING TERMS (allocation of liability; not to be deleted or altered)\n1. Claim period. The buyer shall raise any quality objection within ______ days from arrival of the goods at the port of destination, with photos / video or a third-party inspection report; the seller may reject a claim raised after that period.\n2. Basis of inspection. Quality shall be judged against the sample confirmed and sealed by both parties and the technical standard agreed in the contract; a report commissioned by the buyer alone shall not determine liability — a third-party report accepted by both parties shall.\n3. Allocation of liability. Where the seller is found liable, the seller shall replace or repair the goods or grant an allowance; loss caused by carriage, insurance or the buyer shall be pursued with the seller's assistance but without liability on the seller.\n4. Cap on compensation. In no event shall the seller's liability exceed the contract value of the goods concerned, and it shall exclude indirect losses claimed by the buyer such as downtime, loss of profit and loss of goodwill.\n5. No set-off. The buyer shall not deduct the claimed amount from sums payable without the seller's written consent; any such deduction constitutes a breach by the buyer.\n6. Dispute resolution. Disputes arising from this letter are subject to the dispute resolution agreed in the main contract.\n\n▸Tip: Clause 4 on the cap is the most valuable sentence in the whole letter. Buyers routinely claim downtime and idle labour together with the direct loss; stating that only direct loss is compensated is where the negotiating room is.\n\nSIGNED\n  For the BUYER: Name ____　Title ____　Signature ____　Date ____\n  For the SELLER: Name ____　Title ____　Signature ____　Date ____","sub":true,"step":"结案复盘"},{"k":"ord:10#2","m":"ord","mn":"订单合同","s":10,"n":"退运申请与确认函 Return Cargo Application","sc":"out","lay":"letter","d":"决定退运时用。写清退运方式、运费与责任方、目的港交接安排 —— 这三件事没说清就发函，货到了没人接，滞港费按天涨，最后全算在货主头上。","t":"RETURN CARGO APPLICATION\nOrder No.: SO-______　Our Ref.: RC-______　Date: ______\nTo: ____________ (Company)　Attn: ____________\nCc: Forwarder ____________　Agent at destination ____________\n▸Tip: A return shipment sends the goods backwards — freight, duty and the liable party must be settled first. Without this confirmation the forwarder will not even book the vessel.\n\n1. Goods to be Returned\n  Product / specification: ____________　Quantity: ________　Packages / volume: ______ / ______ CBM\n  Original B/L No.: ____________　Original ETD / ETA: ______ / ______\n  Port of destination / place of storage: ____________\n\n2. Reason for Return (to match the conclusion in the Claim Reply Letter)\n  □Quality not in conformity □Wrong specification □Damage in transit □Buyer cancellation □Other ______\n  Liable party: □us □factory □buyer □carrier / forwarder □shared (ratio ______)\n\n3. Return Arrangements\n  Method: □Full container return □LCL return □Transfer to a third party / on-carriage □Destroy locally (use the Abandonment Notice instead)\n  Expected sailing: ______　Expected arrival: ______\n  Contact for collection / handover at destination: ____________　Tel: ____________\n  Customs procedure: □Customs clearance as returned goods □Other ______\n\n4. Allocation of Costs 【必填】\n  Sea freight: ________　Borne by: □us □buyer □factory □shared\n  Destination charges (demurrage / storage / devanning): ________　Borne by: ______\n  Import duty and VAT: ________　Borne by: ______\n  Total: ________　Currency: ______\n\n★RETURN SHIPMENT TERMS (allocation of liability; not to be deleted or altered)\n1. Deadline for collection. The buyer shall cooperate in completing collection or delivery to the nominated forwarder within ______ days from arrival of the goods at the port of destination; demurrage and storage charges arising thereafter shall be borne by the buyer.\n2. Allocation of costs. Where the return is attributable to the seller, the round-trip freight shall be borne by the seller; where it is attributable to the buyer (order cancellation, specification change, incomplete clearance documents), all freight and destination charges shall be borne by the buyer.\n3. Condition of the goods. Returned goods must remain in their original packing and unused, with packing photos retained; the seller may refuse acceptance of, or grant a reduced allowance for, goods that have been opened, used or are missing accessories.\n4. Duty and drawback. Import taxes arising from the return, and the obligation to repay any export drawback already claimed, shall be performed as agreed in writing by the parties.\n5. Passing of risk. Risk during the return voyage is allocated according to the trade term and insurance arrangements adopted; where the return is for the buyer's reason and no insurance is in place, risk rests with the buyer.\n6. Effectiveness. This letter becomes effective upon signature and return by both parties; arranging the return without a counter-signature is at one's own risk.\n▸Tip: Returned goods must be declared again when re-exported — do not assume that sending them back the same way needs no formalities. The export drawback must be handled in parallel: tax already refunded may have to be repaid.\n\nSIGNED\n  For the BUYER: Name ____　Title ____　Signature ____　Date ____\n  For the SELLER: Name ____　Title ____　Signature ____　Date ____","sub":true,"step":"结案复盘"},{"k":"ord:10#3","m":"ord","mn":"订单合同","s":10,"n":"目的港弃货处置函 Abandonment Notice","sc":"out","lay":"letter","d":"客户明确不要货时用。拿到客户「同意弃货并承担费用」的书面确认，才有资格处置这批货 —— 口头弃货不算数，堆存费和销毁费最后还是找货主。","t":"ABANDONMENT NOTICE\nOrder No.: SO-______　Our Ref.: AB-______　Date: ______\nTo: ____________ (Company)　Attn: ____________\nCc: Agent at destination ____________　Forwarder ____________\n▸Tip: Abandonment does not end with \"we do not want it\" — storage, destruction and clearance liability all remain attached to the holder of the bill of lading. A written confirmation from the buyer that he abandons the goods and bears the costs is indispensable; otherwise the charges come back to the owner (us).\n\n1. The Abandonment\n  Goods: ____________　Quantity / packages: ________ / ______\n  B/L No.: ____________　Date of arrival: ______　Stored at: ____________\n  Costs incurred (as at ______): demurrage / storage ________　other ________ (currency ______)\n\n2. Reason for Abandonment\n  □Buyer refuses acceptance □Clearance documents not in conformity □Market reasons □Quality dispute (see the Claim Reply Letter) □Other ______\n\n3. Disposal\n  □Destroy locally (planned date: ______　by: ____________)\n  □Resell to a third party (buyer: ____________　difference borne by: ____________)\n  □Return to the country of origin (use the Return Cargo Application instead)\n  □Hand over for sale by customs at the port of destination (expected recovery ________)\n\n4. Costs and Authority\n  Does the buyer bear the costs incurred and to be incurred: 【必填】□Yes □No (reason: ____________)\n  Authority granted: the buyer authorises us or our agent to handle □clearance □destruction □resale □sale by customs on his behalf\n  Authority valid until: ______\n\n★ABANDONMENT TERMS (allocation of liability; not to be deleted or altered)\n1. Effectiveness. Abandonment takes effect from the date of the buyer's written confirmation; an oral statement or a statement by telephone is not a basis for abandonment.\n2. Allocation of costs. Storage, demurrage, destruction and clearance charges arising from the buyer's refusal to accept or pay or his failure to collect within the period shall be borne by the buyer; if unpaid, the seller may deduct them from sums received or recover them separately.\n3. Title and right of disposal. After abandonment, title and the right of disposal vest in the seller, who may resell at a reduced price, destroy or return the goods without further consent from the buyer.\n4. Import taxes. Import duty, VAT and penalties arising from abandonment, destruction or resale shall be borne by the liable party.\n5. Insurance. Whether loss from abandonment falls within the cover is determined by the insurance terms; the buyer shall cooperate in providing the documents needed for a claim.\n6. Effect. This letter and its counter-signed copy form an annex to the main contract and have the same effect as the main contract.\n▸Tip: Clause 3 on title vesting in the seller must be there — without it, if you resell the goods, the buyer can come back later and say they were his.\n\nSIGNED\n  Confirmed by the buyer: Name ____　Title ____　Signature ____　Date ____\n\nSIGNED\n  For the BUYER: Name ____　Title ____　Signature ____　Date ____\n  For the SELLER: Name ____　Title ____　Signature ____　Date ____","sub":true,"step":"结案复盘"},{"k":"ord:10#4","m":"ord","mn":"订单合同","s":10,"n":"保险报案单 Insurance Claim Notice","sc":"out","lay":"letter","d":"投保或 CIF 成交的货出险时，向保险人报案用。险种、保单号、损失描述、随附单证、索赔金额一次报全，超过保单期限报案可能直接不赔。","t":"INSURANCE CLAIM NOTICE\nPolicy No.: ____________　Claim No. (for insurer): ____________　Date of notice: ______\nTo: ____________ (Insurer)　Attn: ____________\nInsured: ____________　Order No.: SO-______\n▸Tip: The first thing after a loss is to notify the insurer within the period stipulated in the policy (commonly 30 days after arrival; some short-period covers allow only 3). Miss the deadline and even complete documents may not be paid — file the notice first and supplement the documents afterwards.\n\n1. Insurance Particulars\n  Applicant / insured: ____________\n  Cover: □All risks □WPA □FPA □Rejection risk □Other ______\n  Sum insured: ________ (currency ______)　Percentage covered: ______%　Policy issued on: ______\n  Period of insurance: from ______ to ______\n\n2. Goods and Carriage\n  B/L No.: ____________　Vessel / voyage: ____________\n  Port of loading / discharge: ____________ / ____________　ETD / ETA: ______ / ______\n  Container / seal No.: ________ / ________　No. of packages: ______\n  Invoice No. / value: ____________ / ________\n\n3. Description of the Loss 【必填】\n  Time of loss: ______　Place of loss: ____________\n  Nature of loss: □Breakage □Shortage □Wetting □Total loss □Other ______\n  Quantity damaged / estimated amount: ________ / ________\n  Condition at site: ____________\n\n4. Documents Attached (none may be missing)\n  □Original policy □Bill of lading □Commercial invoice □Packing list □Third-party inspection report □Photos / video of the goods\n  □Statement of claim □Damage record / outturn report at destination □Other ______\n\n5. Claim\n  Amount claimed: ________　Currency: ________\n  Payment: □T/T to the insured's account □Other ______\n\n★CLAIM NOTICE TERMS (notice and claim; not to be deleted or altered)\n1. Time limit for notice. The insured shall notify the insurer within ______ days of discovering the loss and in any event not later than the claim period stipulated in the policy; where late notice prevents the insurer from assessing the loss, the insurer shall not be liable.\n2. Duty to mitigate. The insured shall take reasonable measures promptly to prevent further loss; loss increased by failure to mitigate shall not be compensated.\n3. Authenticity of documents. Documents submitted must be true and complete; the insurer may refuse payment and pursue liability where documents are false.\n4. Subrogation. After payment, the insured shall assign to the insurer his rights of recovery against the carrier and third parties and assist in the recovery.\n5. Deductible and proportion. The amount payable is calculated on the deductible and percentage covered stipulated in the policy and may be lower than the amount claimed.\n6. Basis of assessment. The extent of loss is determined by the inspection report of a surveyor accepted by the insurer.\n▸Tip: A \"damage record\" signed by the destination agent or the master carries far more weight than photographs taken by ourselves. Ask for it at discharge — once the vessel has sailed, no one will issue it.\n\nSIGNED & SEALED\n  Insured (seal): ____________　Handler: ________　Date: ______\n  Received by the insurer: ____________　Date: ______","sub":true,"step":"结案复盘"},{"k":"cust:0","m":"cust","mn":"客户名录","s":0,"n":"客户档案表 / KYC 调查表","sc":"in","lay":"form","d":"新客户建档一次，后面所有报价、合同、信用判断都读这份。KYC 那几栏是反洗钱与制裁筛查的留痕，也是高风险国家收款被银行拦下时唯一能自证的材料。","t":"【客户档案表 / KYC 调查表】CUS-______\n▸新手提示：这份表建档时填一次就行，但「信用与风险」那一栏要**每次出事前更新**。客户档案最怕的是建完就再没人看。\n\n一、主体信息\n  客户名称（英文，与合同一致）：【必填】____________\n  客户名称（中文 / 当地语言）：____________\n  国别 / 地区：【必填】____________　城市：____________\n  注册地址：____________\n  公司类型：□进口商 □批发商 □零售商 □品牌商 □制造商 □贸易商 □其他 ______\n  成立年份：______　员工规模：□1–10 □11–50 □51–200 □200+\n  官网：____________\n▸新手提示：客户名称必须记**英文全称**，且和将来合同、发票、提单上的抬头一字不差。写简称，开信用证和办产地证时对不上，改单要花钱。\n\n二、联系人\n  主要联系人 / 职位：____________　邮箱：____________\n  电话 / WhatsApp：____________　时区：____________\n  决策角色：□决策人 □影响者 □执行人 □未知\n  备用联系人：____________\n\n三、业务画像\n  主营产品：____________　目标市场：____________\n  与我方合作的品类：____________\n  年采购量（估算）：____________　采购频次：□ monthly □季度 □年度 □不定\n  是否要求独家 / 代理：□否 □是（区域 ______，期限 ______）\n  认证 / 合规要求：□CE □FDA □UL □REACH □其他 ______ □无\n\n四、商务条件（谈定的口径）\n  常用贸易术语：□EXW □FOB □CFR □CIF □DDP □其他 ______\n  结算币种：□USD □EUR □RMB □其他 ______\n  付款方式：□T/T □L/C at sight □L/C __ days □D/P □D/A □OA __ 天\n  账期：______ 天　信用额度：____________\n  定金比例：______%\n\n五、信用与风险\n  信用等级：□A（可放账）□B（款到发货）□C（预付全款）□D（黑名单，禁止交易）\n  历史逾期次数：______　当前逾期金额：____________　最长逾期天数：______\n  是否有过索赔 / 纠纷：□否 □是（说明 ____________）\n  风险备注：____________\n\n六、KYC / 合规筛查（必填，留痕用）\n  实际受益人（UBO）：____________　国籍：____________\n  □ 已完成受制裁国家 / 地区及实体清单筛查，无命中\n  □ 客户注册地不在高风险司法辖区\n  □ 非政治公众人物（PEP）；是 PEP 的已取得上级书面同意\n  □ 付款方与买方一致；存在第三方代付的已取得买方书面授权\n  筛查日期：______　筛查人：______\n▸新手提示：KYC 这几栏别嫌麻烦。高风险国家的款项被银行拦截时，能拿出来证明\"我做过筛查、留过痕\"的只有这张表 —— 没有它，钱冻在银行里几个月。\n\n七、建档\n  建档人：______　建档日期：______　复核人：______\n  下次复核日期：______\n▸新手提示：信用记录为 D 的客户，系统在订单「已出货」环节会直接拦住不让走。建档时判成 D，就等于提前把雷排掉。","sub":false},{"k":"sam:0","m":"sam","mn":"样品台账","s":0,"n":"样品申请单","sc":"in","lay":"form","d":"不问清楚就寄，客户收到说\"不是我想要的\"，白寄还亏运费。","t":"【样品申请单】SAM-______\n▸新手提示：寄样前一定要拿到客户的书面确认——颜色、尺寸、logo 位置、包装。这一步省掉的，后面全都要还回去。\n\n客户名称：【必填】____________　关联询盘：INQ-______\n收件人 / 电话 / 地址：____________________________\n────────────────────────────────────────\n产品名称：【必填】____________　规格：____________\n样品数量：________　样品单价：________\n样品成本预估：________\n收费方式：□免费 □收费（______）□退回后退还\n客户是否接受打样费：□是 □否 □未询问\n▸新手提示：客户说\"先寄来看看\"时，一定要顺势报价   var sayTotal = '';
  if(lang === 'zh') sayTotal = numToMoneyCN(totals.amount);
  else sayTotal = numToMoneyEN(totals.amount, CUR_NAMES[cur] || cur);
  var theme = THEMES.filter(function(t){ return t.id === themeId; })[0] || THEMES[0];
  return {
    order: order, items: items, totals: totals, T: T, lang: lang, theme: theme, cur: cur,
    company: set.company, bank: set.bank, signImage: set.signImage, sealImage: set.sealImage,
    logo: set.logo, sayTotal: sayTotal, opts: opts, docNo: ''
  };
}

/* ---------- 区块 ---------- */
function dHead(ctx, typeLabel, metaPairs){
  var c = ctx.company, T = ctx.T;
  var logo = ctx.logo ? '<img src="' + ctx.logo + '" alt="logo">' : '<span class="d-logo-ph">YOUR LOGO</span>';

    '<div class="d-brand">' +
      '<div class="d-logo">' + logo + '</div>' +
      '<div class="d-cname">' + esc(c.nameEn || c.name) + '</div>' +
      (c.nameEn ? '<div class="d-cname-cn">' + esc(c.name) + '</div>' : '') +
      '<div class="d-caddr">' + esc(c.address || '') + '</div>' +
      '<div class="d-caddr">' + [c.tel ? 'Tel: ' + c.tel : '', c.email || '', c.website || ''].filter(Boolean).join('&nbsp;&nbsp;|&nbsp;&nbsp;') + '</div>' +
    '</div>' +

      '<div class="d-type">' + esc(typeLabel) + '</div>' +
      '<div class="d-meta">' + metaPairs.map(function(p){

function dParties(ctx){
  var T = ctx.T, o = ctx.order, cust = orderCustomer(o);

      (ctx.company.nameEn ? '<div class="d-pcn">' + esc(ctx.company.name) + '</div>' : '') +
      '<div class="d-plines">' + sellerLines + '</div></div>' +
    '<div class="d-party"><div class="d-plabel">' + esc(T.to) + '</div>' +
      '<div class="d-pname">' + esc(buyerName) + '</div>' +
      '<div class="d-plines">' + buyerLines + '</div></div>' +
  '</div>';
}
function dKv(items){
  return '<div class="d-kv">' + items.map(function(kv){
    return '<div class="d-kvitem"><div class="d-kvl">' + esc(kv[0]) + '</div><div class="d-kvv">' + esc(kv[1] || '—') + '</div></div>';
  }).join('') + '</div>';
}
function dItems(ctx, mode){
  var hasPhoto = (ctx.items || []).some(function(it){ return !!it.photo; });
  ctx = Object.assign({}, ctx, {opts: Object.assign({}, ctx.opts, {showPhoto: ctx.opts.showPhoto && hasPhoto})});
  var T = ctx.T, o = ctx.opts, items = ctx.items;

    return '<table class="d-items"><thead><tr>' +
      '<th class="c-no">' + esc(T.no) + '</th><th>' + esc(T.desc) + '</th>' +
      '<th class="c-q">' + esc(T.qty) + '</th><th class="c-u">' + esc(T.unit) + '</th>' +
      '<th class="c-n">QTY/CTN</th><th class="c-n">CTNS</th><th class="c-n">N.W. (KGS)</th>' +
      '<th class="c-n">G.W. (KGS)</th><th class="c-n">CBM</th></tr></thead><tbody>' +
      items.map(function(it, i){
        return '<tr><td class="c-no">' + (i + 1) + '</td>' +
          '<td><div class="d-name">' + esc(it.name) + '</div><div class="d-sub">' + [it.spec, it.hs ? 'HS: ' + it.hs : '', it.model ? 'NO: ' + it.model : ''].filter(Boolean).join(' · ') + '</div></td>' +
          '<td class="c-q">' + fmtNum(it.qty, 0) + '</td><td class="c-u">' + esc(it.unit) + '</td>' +
          '<td class="c-n">' + (it.ctn > 0 ? fmtNum(it.qty / it.ctn, 0) : '—') + '</td>' +
          '<td class="c-n">' + fmtNum(it.ctn, 0) + '</td><td class="c-n">' + fmtNum(it.nw, 2) + '</td>' +
          '<td class="c-n">' + fmtNum(it.gw, 2) + '</td><td class="c-n">' + fmtNum(it.vol, 3) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  return '<table class="d-items"><thead><tr>' +
    (o.showPhoto ? '<th class="c-ph">' + esc(T.photo) + '</th>' : '') +
    '<th>' + esc(T.desc) + '</th>' +
    '<th class="c-no">' + esc(T.no) + '</th>' +
    '<th class="c-u">' + esc(T.unit) + '</th>' +
    '<th class="c-q">' + esc(T.qty) + '</th>' +
    '<th class="c-p">' + esc(T.unitPrice) + '</th>' +
    '<th class="c-a">' + esc(T.amount) + '</th></tr></thead><tbody>' +
    items.map(function(it, i){
      return '<tr>' +
        (o.showPhoto ? '<td class="c-ph">' + (it.photo ? '<img class="d-photo" src="' + it.photo + '">' : '<div class="d-photo ph"></div>') + '</td>' : '') +
        '<td><div class="d-name">' + esc(it.name) + '</div><div class="d-sub">' + [it.spec, (o.showHS && it.hs) ? 'HS: ' + it.hs : ''].filter(Boolean).join(' · ') + '</div></td>' +
        '<td class="c-no">' + esc(it.model || '—') + '</td>' +
        '<td class="c-u">' + esc(it.unit) + '</td>' +
        '<td class="c-q">' + fmtNum(it.qty, 0) + '</td>' +
        '<td class="c-p">' + (it.currency === ctx.cur ? fmtMoney(it.price) : fmtMoney(it.price, it.currency)) + '</td>' +
        '<td class="c-a">' + (it.currency === ctx.cur ? fmtMoney(it.amount) : fmtMoney(it.amount, it.currency)) + '</td></tr>';
    }).join('') + '</tbody></table>';
}
function dSummary(ctx, withAmount){
  var T = ctx.T, t = ctx.totals;
  var qtyStr = Object.keys(t.qtyByUnit).map(function(u){ return fmtNum(t.qtyByUnit[u], 0) + ' ' + u; }).join(' + ') || '0';
  var cells = '<div class="d-sumcell"><span>' + esc(T.totalQty) + '</span><b>' + esc(qtyStr) + '</b></div>' +
    '<div class="d-sumcell"><span>' + esc(T.cartons) + '</span><b>' + fmtNum(t.ctn, 0) + ' CTNS</b></div>' +
    '<div class="d-sumcell"><span>' + esc(T.gw) + '</span><b>' + fmtWeight(t.gw) + '</b></div>' +
    '<div class="d-sumcell"><span>' + esc(T.nw) + '</span><b>' + fmtWeight(t.nw) + '</b></div>' +
    '<div class="d-sumcell"><span>' + esc(T.vol) + '</span><b>' + fmtVol(t.vol) + '</b></div>';
  var total = withAmount ? '<div class="d-sumtotal"><span>' + esc(T.total) + '</span><b>' + fmtMoney(t.amount, ctx.cur) + '</b></div>' : '';
  var words = (withAmount && ctx.sayTotal) ? '<div class="d-words">' + esc(T.sayTotal) + ': ' + esc(ctx.sayTotal) + '</div>' : '';
  /* 明细含多种币种时标注折算，避免与合计对不上被质疑 */
  var otherCur = {};
  (ctx.items || []).forEach(function(it){ if(it.currency && it.currency !== ctx.cur) otherCur[it.currency] = 1; });
  var curNote = Object.keys(otherCur).length
    ? '<div class="d-cur-note">* 外币明细已按当日汇率折为 ' + esc(ctx.cur) + ' 计入合计</div>' : '';
  return '<div class="d-sum">' + cells + total + '</div>' + words + curNote;
}
function dTerms(ctx, extraLines, withStd){
  var T = ctx.T;
  var lines = (extraLines || []).filter(Boolean);
  if(withStd !== false) lines = lines.concat(T.std || []);
  if(!lines.length) return '';
  return '<div class="d-terms"><div class="d-terms-t">' + esc(T.terms) + '</div><ul>' +
    lines.map(function(l){ return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></div>';
}
/* 贸易术语责任块：插在条款区末尾，避免与成交条件矛盾 */
function incoBlock(ctx){
  var term = (ctx.order && ctx.order.terms) ? ctx.order.terms.tradeTerm : '';
  var lines = (typeof incoLines === 'function') ? incoLines(term, ctx.lang) : [];
  if(!lines.length) return '';
  var title = (ctx.lang === 'zh') ? '责任划分（按所选贸易术语）' : 'ALLOCATION OF RISK AND COST (' + String(term).toUpperCase() + ')';
  return '<div class="d-clause"><div class="d-cl-t">' + esc(title) + '</div><div class="d-cl-b">' +
    lines.map(esc).join('<br>') + '</div></div>';
}

function dSign(ctx, force){  var show = force || ctx.opts.showSign;
  if(!show) return '';
  if(!force && !ctx.signImage && !ctx.sealImage) return '';
  var T = ctx.T;
  var seal = (ctx.opts.showSeal === false) ? '' : ctx.sealImage;
  return '<div class="d-sign">' +
    '<div class="d-signbox"><div class="d-slabel">' + esc(T.sellerSign) + '</div><div class="d-sarea">' +
      (ctx.signImage ? '<img class="d-signimg" src="' + ctx.signImage + '">' : '') +
      (seal ? '<img class="d-sealimg" src="' + seal + '">' : '') +
      '<div class="d-sline"></div></div><div class="d-shint">' + esc(T.authSign) + '</div></div>' +
    (force ? '<div class="d-signbox"><div class="d-slabel">' + esc(T.buyerSign) + '</div><div class="d-sarea"><div class="d-sline"></div></div><div class="d-shint">' + esc(T.accepted) + '</div></div>' : '') +
  '</div>';
}
function dFoot(ctx){
  var ver = (typeof APP_VER !== 'undefined') ? APP_VER : '';
  return '<footer class="d-foot"><span>' + esc(ctx.company.name) + ' · ' + esc(ctx.company.website || '') + '</span>' +
    '<span>' + esc(ctx.docNo || '') + (ver ? ' · ' + esc(ver) : '') + '</span></footer>';
}
function dPage(ctx, inner){
  ctx.typeKey = ctx.typeKey || 'quotation';
  return '<div class="doc" data-theme="' + ctx.theme.id + '">' + inner + dFoot(ctx) + '</div>';
}
function kvMain(ctx){
  var T = ctx.T, o = ctx.order.terms;
  var route = [o.portLoading, o.portDest].filter(Boolean).join(' → ');
  return dKv([[T.lInco, [o.tradeTerm].filter(Boolean).join(' ')],
    [T.lLead, o.deliveryDate], [T.lPay, o.paymentTerm], [T.lPort, route], [T.lCur, o.currency]]);
}
function extraTermLines(ctx){
  var T = ctx.T, o = ctx.order.terms;
  var arr = [];
  if(o.warranty) arr.push(T.warranty + ': ' + o.warranty);
  if(o.packing) arr.push(T.packingM + ': ' + o.packing);
  if(o.remarks) arr.push(T.remarks + ': ' + o.remarks);
  /* 按所选贸易术语插入责任划分，避免条款与实际成交条件矛盾 */
  if(typeof incoLines === 'function'){
    arr = arr.concat(incoLines(o.tradeTerm, ctx.lang));
  }
  ((ctx.opts && ctx.opts.customFields) || []).forEach(function(f){
    if(f && f.label && f.value && arr.indexOf(f.label + ': ' + f.value) < 0) arr.push(f.label + ': ' + f.value);
  });
  return arr;
}

/* ---------- 1. 报价单 ---------- */
function renderQuotation(ctx){
  ctx.typeKey = 'quotation';
  var T = ctx.T, o = ctx.order;
  var vu = o.terms.validUntil || ('30 ' + (T.validDays || ''));
  var m = vu.match(/^(\d+)\s*days?/i);
  var vuText = m ? (m[1] + ' ' + (T.validDays || 'days from date of offer')) : vu;
  var inner = dHead(ctx, T.quotation, [[T.no, ctx.docNo], [T.date, o.date], [T.validUntil, vuText]]) +
    dParties(ctx) + kvMain(ctx) + dItems(ctx) + dSummary(ctx, true) +
    dTerms(ctx, extraTermLines(ctx)) + dSign(ctx);
  return dPage(ctx, inner);
}
/* ---------- 2. 形式发票 ---------- */
function renderProforma(ctx){
  ctx.typeKey = 'proforma';

      [[T.beneficiary, ctx.bank.beneficiary], [T.bankName, ctx.bank.bankName], [T.accountNo, ctx.bank.accountNo], [T.swift, ctx.bank.swiftCode]]
      .map(function(kv){ return '<div class="d-bankitem"><span>' + esc(kv[0]) + '</span><b>' + esc(kv[1] || '—') + '</b></div>'; }).join('') +
    '</div>' + (ctx.bank.bankAddress ? '<div class="d-bankaddr">' + esc(ctx.bank.bankAddress) + '</div>' : '') + '</div>' +
    '<div class="doc-tail">' + dTerms(ctx, extraTermLines(ctx)) + dSign(ctx, true) + '</div>';

/* ---------- 3. 销售合同 ---------- */
function renderContract(ctx){
  ctx.typeKey = 'contract';
  var T = ctx.T, o = ctx.order, C = T.clauses;
  var fill = {
    seller: esc(ctx.company.name) + (ctx.company.nameEn ? ' (' + esc(ctx.company.nameEn) + ')' : ''),
    buyer: esc(orderCustomer(o).company || ''),
    totalAmount: fmtMoney(ctx.totals.amount, ctx.cur), sayTotal: esc(ctx.sayTotal), currency: ctx.cur,
    tradeTerms: esc(o.terms.tradeTerm || ''), paymentTerms: esc(o.terms.paymentTerm || ''),
    deliveryTime: esc(o.terms.deliveryDate || ''), portLoading: esc(o.terms.portLoading || ''), portDest: esc(o.terms.portDest || '')
  };
  function f(t){ return esc(t).replace(/\{(\w+)\}/g, function(_, k){ return fill[k] || ''; }); }
  var keys = ['parties','products','price','payment','delivery','packing','inspection','force','arbitration','misc'];
  var inner = dHead(ctx, T.contract, [[T.contractNo, ctx.docNo], [T.date, o.date], [T.currency, ctx.cur]]) +
    dParties(ctx) + kvMain(ctx) +
    '<div class="d-sec">' + esc(T.items) + '</div>' + dItems(ctx) + dSummary(ctx, true) +
    '<div class="d-clauses">' + keys.map(function(k){
      return '<div class="d-clause"><div class="d-cl-t">' + esc(C[k]) + '</div><div class="d-cl-b">' + f(C[k + 'T']) + '</div></div>';
    }).join('') + incoBlock(ctx) + '</div>' +
    '<div class="d-cert">' + esc(T.contractCert) + '</div>' + dSign(ctx, true);
  return dPage(ctx, inner);
}
/* ---------- 4. 商业发票 ---------- */
function renderCommercial(ctx){
  ctx.typeKey = 'commercial';
  var T = ctx.T, o = ctx.order;
  var meta = [[T.invoiceNo, ctx.docNo], [T.date, o.date], [T.orderNo, o.orderNo || ctx.docNo]];
  if(o.terms.lcNo) meta.push([T.lcNo, o.terms.lcNo]);
  if(o.terms.blNo) meta.push(['B/L No.', o.terms.blNo]);
  if(o.terms.vessel) meta.push([T.vessel, [o.terms.vessel, o.terms.voyage].filter(Boolean).join(' / ')]);
  if(o.terms.containerNo) meta.push(['Container No.', o.terms.containerNo]);
  var inner = dHead(ctx, T.commercial + (ctx.lang === 'zh' ? ' · 正本' : ' — ORIGINAL'), meta) + dParties(ctx) + kvMain(ctx) +
    dItems(ctx) + dSummary(ctx, true) +
    (function(){
      /* CIF/CFR/CPT/CIP 发票须拆列 FOB 货值、运费、保险费，否则海关估价与信用证审单会被卡 */
      var tm = o.terms || {};
      var termUp = String(tm.tradeTerm || '').trim().toUpperCase();
      if(!/^(CIF|CFR|CPT|CIP)/.test(termUp)) return '';
      var fr = +tm.freight || 0, ins = +tm.insurance || 0;
      if(!fr && !ins){
        return '<div class="d-note-warn">' + (ctx.lang === 'zh'
          ? '本单为 ' + esc(termUp) + ' 术语，请在「出运信息」中填写运费与保险费，发票将自动拆列 FOB 货值。'
          : 'This invoice is issued on ' + esc(termUp) + ' terms. Enter freight and insurance in Shipment Details to show the FOB value breakdown.') + '</div>';
      }
      var fob = ctx.totals.amount - fr - ins;
      return dKv([
        ['FOB Value', fmtMoney(fob, ctx.cur)],
        ['Freight', fmtMoney(fr, ctx.cur)],
        ['Insurance', fmtMoney(ins, ctx.cur)],
        [termUp + ' Value', fmtMoney(ctx.totals.amount, ctx.cur)]
      ]);
    })() +
    '<div class="d-cert">' + esc(T.certCI) + '</div>' +
    '<div class="d-marks"><span>' + esc(T.marks) + '</span><b>' + esc(o.terms.marks || 'N/M') + '</b></div>' +
    '<div class="doc-tail">' + dTerms(ctx, (function(){
      var t = ctx.totals;
      return [
        'We certify that the goods described in this invoice are of Chinese origin, and that the particulars are true and correct in every respect.',
        'This invoice is issued under contract ' + (o.orderNo || ctx.docNo) + '. The quantity, description and value agree with the packing list and the bill of lading; in case of discrepancy the contract prevails.',
        'Payment shall be made strictly as stated above. Bank charges outside the seller bank, including intermediary bank charges, are for the buyer account.',
        'The value declared herein is the transaction value for customs valuation purposes and includes the packing cost.',
        'Any alteration to this invoice is invalid unless signed and stamped by the seller. This invoice forms part of the shipping documents.'
      ].concat(extraTermLines(ctx));
    })(), false) + dSign(ctx, true) + '</div>';
  return dPage(ctx, inner);
}
/* ---------- 5. 装箱单 ---------- */

/* ---------- 7. 订舱委托书（中文） ---------- */
function renderBooking(ctx){
  ctx.typeKey = 'booking';
  var T = ctx.T, o = ctx.order, tm = o.terms || {}, c = ctx.company, cust = orderCustomer(o);
  var info = dKv([
    ['委托单号', ctx.docNo], ['订舱号', tm.bookingNo], ['船公司', tm.carrier],
    ['船名 / 航次', [tm.vessel, tm.voyage].filter(Boolean).join(' / ')],
    ['起运港', tm.portLoading], ['目的港', tm.portDest],
    ['开船日 ETD', tm.etd || tm.sailing], ['预计到港 ETA', tm.eta],
    ['截关 / 截港时间', tm.cutoff], ['柜型柜量', tm.containerType || '1 × 40HQ'], ['贸易条款', tm.tradeTerm]
  ]);
  /* 运费预付/到付必须与贸易术语一致：FOB/FAS/FCA/EXW 为到付 */
