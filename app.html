/* ========== 报价计算器（独立工具，结果手工填入单据） ========== */
/*
  公式（全部以人民币为基准，最后按汇率折外币）：
    不含税单价 = 含税单价 ÷ (1 + 增值税率)      [采购价选"不含税"时直接用]
    不含税成本 = 不含税单价 × 数量
    可退税额   = 不含税成本 × 退税率
    实际成本   = 不含税成本 − 可退税额
    费用合计   = 港杂+报关+拖车+商检+海运费+保险+其他
    保本收入   = 实际成本 + 费用合计
    报价(元)   = 保本收入 ÷ (1 − 目标净利率 − 佣金率)
    报价(外币) = 报价(元) ÷ 汇率
    单价(外币) = 报价(外币) ÷ 数量，再按尾数规则取整
    毛利(含佣金) = 最终报价(元) − 保本收入
    佣金         = 最终报价(元) × 佣金率
    净利         = 毛利 − 佣金
    换汇成本     = 实际成本 ÷ 报价(外币)
*/
var CALC_KEY = 'calc_v1';
var CALC_FEES = ['port', 'customs', 'truck', 'inspect', 'freight', 'ins', 'other'];
var CALC_FEE_LABEL = {port:'港杂费', customs:'报关费', truck:'拖车/内陆运输', inspect:'商检/认证', freight:'海运费', ins:'保险费', other:'其他费用'};
var CALC_DEF = {
  qty: 1000, unit: 'PCS', cur: 'USD', rate: 7.1,
  mode: 'incl', price: 113, vat: 13, rebate: 13,
  port: 0, customs: 0, truck: 0, inspect: 0, freight: 0, ins: 0, other: 0,
  margin: 20, comm: 0, round: 'up0.01',
  target: 0
};
var CALC = null;

function calcLoad(){
  if(CALC) return CALC;
  var s = null;
  try { s = JSON.parse(lsGet(CALC_KEY) || 'null'); } catch(e){}
  CALC = {};
  for(var k in CALC_DEF) CALC[k] = (s && s[k] !== undefined) ? s[k] : CALC_DEF[k];
  return CALC;
}
function calcSave(){ lsSet(CALC_KEY, JSON.stringify(calcLoad())); }

function calcRound(x, mode){
  var step = 1;
  if(mode.indexOf('0.01') >= 0) step = 0.01;
  else if(mode.indexOf('0.1') >= 0) step = 0.1;
  var n = x / step;
  var k = (mode.indexOf('up') === 0) ? Math.ceil(n - 1e-9) : Math.round(n);
  return k * step;
}

/* 纯计算，返回结果对象；不触碰 DOM */
function calcRun(d){
  var r = {ok:false, err:'', warn:[]};
  var qty = +d.qty || 0, rate = +d.rate || 0, vat = +d.vat || 0, reb = +d.rebate || 0;
  var m = +d.margin || 0, c = +d.comm || 0;

  if(qty <= 0){ r.err = '数量必须大于 0'; return r; }
  if(rate <= 0){ r.err = '汇率必须大于 0'; return r; }
  if(m < 0 || c < 0){ r.err = '毛利率与佣金率不能为负数'; return r; }
  if(m + c >= 95){ r.err = '毛利率 + 佣金率过高（需小于 95%）'; return r; }
  if(vat < 0 || reb < 0){ r.err = '税率不能为负数'; return r; }
  if(reb > vat) r.warn.push('退税率高于增值税率，实际申报中通常不出现，请核实');

  var p = +d.price || 0;
  var baseUnit = d.mode === 'incl' ? p / (1 + vat / 100) : p;
  var baseTotal = baseUnit * qty;
  var rebateAmt = baseTotal * reb / 100;
  var realCost = baseTotal - rebateAmt;
  var feeTotal = 0;
  CALC_FEES.forEach(function(k){ feeTotal += (+d[k] || 0); });
  var breakEven = realCost + feeTotal;
  if(breakEven <= 0){ r.err = '成本与费用合计为 0，请检查输入'; return r; }

  var quoteCNY = breakEven / (1 - m / 100 - c / 100);
  var unitRaw = quoteCNY / rate / qty;
  var unit = calcRound(unitRaw, d.round || 'up0.01');
  var totalFX = unit * qty;
  var totalCNY = totalFX * rate;

  var gross = totalCNY - breakEven;
  var commAmt = totalCNY * c / 100;
  var net = gross - commAmt;

  r.ok = true;
  r.qty = qty;
  r.baseUnit = baseUnit;
  r.baseTotal = baseTotal;
  r.rebateAmt = rebateAmt;
  r.realCost = realCost;
  r.realCostUnit = realCost / qty;
  r.feeTotal = feeTotal;
  r.breakEven = breakEven;
  r.breakEvenUnit = breakEven / rate / qty;
  r.quoteCNY = quoteCNY;
  r.quoteFX = quoteCNY / rate;
  r.unitRaw = unitRaw;
  r.unit = unit;
  r.totalFX = totalFX;
  r.totalCNY = totalCNY;
  r.gross = gross;
  r.grossRate = totalCNY > 0 ? gross / totalCNY * 100 : 0;
  r.commAmt = commAmt;
  r.net = net;
  r.netRate = totalCNY > 0 ? net / totalCNY * 100 : 0;
  r.fxCost = totalFX > 0 ? realCost / totalFX : 0;

  /* 客户还价反算 */
  var tg = +d.target || 0;
  if(tg > 0){
    var tCNY = tg * qty * rate;
    r.targetUnit = tg;
    r.targetCNY = tCNY;
    r.targetGross = tCNY - breakEven;
    r.targetGrossRate = tCNY > 0 ? r.targetGross / tCNY * 100 : 0;
    r.targetNet = r.targetGross - tCNY * c / 100;
    r.targetNetRate = tCNY > 0 ? r.targetNet / tCNY * 100 : 0;
    r.targetLoss = r.targetGross < 0;
  }
  return r;
}

function calcMoney(n, dec){
  if(!isFinite(n)) return '—';
  return n.toLocaleString('zh-CN', {minimumFractionDigits: dec === undefined ? 2 : dec, maximumFractionDigits: dec === undefined ? 2 : dec});
}
function calcSym(cur){
  return {USD:'$', EUR:'€', CNY:'¥', GBP:'£', JPY:'¥'}[cur] || (cur + ' ');
}

function calcOutHtml(r){
  var d = calcLoad();
  if(!r.ok){
    return '<div class="card"><div class="card-b"><div class="calc-err">' + esc(r.err) + '</div>' +
      '<div class="hint">填好左侧参数后，这里会显示建议报价。</div></div></div>';
  }
  var sym = calcSym(d.cur);
  var warn = r.warn.length ? '<div class="calc-warn">' + r.warn.map(esc).join('<br>') + '</div>' : '';

  var target = '';
  if(r.targetUnit){
    var cls = r.targetLoss ? 'bad' : (r.targetNetRate < 5 ? 'warn' : 'ok');
    target = '<div class="card"><div class="card-h"><h3>客户还价反算</h3><span class="xs faint">按 ' + sym + calcMoney(r.targetUnit) + ' / ' + esc(d.unit) + '</span></div>' +
      '<div class="card-b"><div class="calc-list">' +
        calcRow('毛利率（含佣金）', calcMoney(r.targetGrossRate, 2) + '%', cls) +
        calcRow('净利率（扣佣金）', calcMoney(r.targetNetRate, 2) + '%', cls) +
        calcRow('净利金额', '¥ ' + calcMoney(r.targetNet), cls) +
        (r.targetLoss ? '<div class="calc-warn bad">按此价成交会亏本，亏损 ¥ ' + calcMoney(Math.abs(r.targetNet)) + '</div>' : '') +
      '</div></div></div>';
  }

  return '<div class="calc-main">' +
      '<div class="calc-hero">' +
        '<div class="ch-label">建议单价</div>' +
        '<div class="ch-val">' + sym + calcMoney(r.unit) + '</div>' +
        '<div class="ch-sub">/ ' + esc(d.unit) + ' · 建议总价 ' + sym + calcMoney(r.totalFX) + '</div>' +
      '</div>' + warn +
      '<div class="calc-list">' +
        calcRow('保本单价', sym + calcMoney(r.breakEvenUnit), '') +
        calcRow('理论单价（未取整）', sym + calcMoney(r.unitRaw, 4), '') +
        (r.commAmt > 0
          ? calcRow('毛利（含佣金）', '¥ ' + calcMoney(r.gross) + '　' + calcMoney(r.grossRate, 2) + '%', 'ok') +
            calcRow('其中佣金', '− ¥ ' + calcMoney(r.commAmt), '') +
            calcRow('净利（扣佣金后）', '¥ ' + calcMoney(r.net) + '　' + calcMoney(r.netRate, 2) + '%', 'ok')
          : calcRow('本单毛利', '¥ ' + calcMoney(r.gross) + '　' + calcMoney(r.grossRate, 2) + '%', 'ok')) +
        calcRow('换汇成本', calcMoney(r.fxCost, 3) + ' 元/' + d.cur, (r.fxCost > 8 || r.fxCost < 4) ? 'warn' : '') +
      '</div>' +
      '<div class="calc-sep">成本拆解</div>' +
      '<div class="calc-list">' +
        calcRow('不含税单价', '¥ ' + calcMoney(r.baseUnit, 4), '') +
        calcRow('不含税成本合计', '¥ ' + calcMoney(r.baseTotal), '') +
        calcRow('可退税额', '− ¥ ' + calcMoney(r.rebateAmt), r.rebateAmt > 0 ? 'ok' : '') +
        calcRow('实际成本', '¥ ' + calcMoney(r.realCost) + '　（' + calcMoney(r.realCostUnit) + '/件）', '') +
        calcRow('费用合计', '¥ ' + calcMoney(r.feeTotal), '') +
        calcRow('保本收入', '¥ ' + calcMoney(r.breakEven), '') +
      '</div>' +
      '<div class="calc-acts">' +
        '<button class="btn btn-primary btn-sm" onclick="A.calcCopy(\'unit\')">复制单价</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="A.calcCopy(\'all\')">复制全部结果</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="A.calcReset()">恢复默认</button>' +
      '</div>' +
    '</div>' + target;
}
function calcRow(k, v, cls){
  return '<div class="calc-row' + (cls ? ' ' + cls : '') + '"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>';
}

function calcBarHtml(r){
  var d = calcLoad();
  if(!r.ok) return '<span>参数不完整</span><i>查看明细 ↑</i>';
  var sym = calcSym(d.cur);
  return '<span>建议单价 <b>' + sym + calcMoney(r.unit) + '</b> / ' + esc(d.unit) + '</span>' +
    '<i>毛利 ' + calcMoney(r.grossRate, 1) + '% ↑</i>';
}

function calcField(label, key, val, type){
  return '<div class="field"><span>' + esc(label) + '</span>' +
    '<input class="inp" type="' + type + '" inputmode="decimal" value="' + esc(String(val)) + '" ' +
    'oninput="A.calcSet(\'' + key + '\',this.value)"></div>';
}

function calcPaint(){
  var el = document.getElementById('calcOut');
  if(!el) return;
  var r = calcRun(calcLoad());
  el.innerHTML = calcOutHtml(r);
  var bar = document.getElementById('calcBar');
  if(bar) bar.innerHTML = calcBarHtml(r);
  calcBarPos();
  setTimeout(calcBarPos, 60);
}

/* 手机端：吸底条要避开底部导航和授权提示条 */
function calcBarPos(){
  var bar = document.getElementById('calcBar');
  if(!bar) return;
  if(getComputedStyle(bar).display === 'none'){ bar.style.bottom = ''; return; }
  var lic = document.getElementById('licBar');
  var mob = document.querySelector('.mob-nav');
  var base = mob ? mob.getBoundingClientRect().height : 60;
  var extra = 0;
  if(lic && getComputedStyle(lic).display !== 'none' && lic.getBoundingClientRect().height > 0){
    extra = lic.getBoundingClientRect().height + 10;
  }
  bar.style.bottom = (base + extra) + 'px';
}

function copyText(txt, okMsg){
  function done(){ toast(okMsg || '已复制'); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch(e){ toast('复制失败，请手动选中复制', false); }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  } else {
    fallback();
  }
}

function eulaGet(){
  try { return JSON.parse(lsGet(K_EULA) || 'null'); } catch(e){ return null; }
}
function eulaAgreed(){
  var r = eulaGet();
  return !!(r && r.ver === EULA_VER && r.at);
}
function eulaAgree(){
  var now = new Date();
  var at = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate()) +
    ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  lsSet(K_EULA, JSON.stringify({ver: EULA_VER, at: at, app: APP_VER}));
  var el = document.getElementById('eulaWrap');
  if(el) el.parentNode.removeChild(el);
  boot();
}

  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  return S.orders.filter(function(o){
    var d = new Date(o.date);
    return d.getFullYear() === y && d.getMonth() === m;
  });
}
function orderAmount(order){
  return calcTotals(order.items, order.terms.currency).cnyAmount;
}

      return (o.orderNo || '').toLowerCase().indexOf(q) >= 0 ||

function timeAgo(ts){
  if(!ts) return '';
  var d = Math.floor((Date.now() - ts) / 60000);
  if(d < 1) return '刚刚';
  if(d < 60) return d + ' 分钟前';
  if(d < 1440) return Math.floor(d / 60) + ' 小时前';
  return Math.floor(d / 1440) + ' 天前';
}

/* ---------- 草稿 ---------- */
function saveDraft(){
  try{
    if(!WORK) return;
    WORK.updatedAt = Date.now();
    lsSet(DRAFT_KEY, JSON.stringify(WORK));
    var h = document.getElementById('saveHint');
    if(h) h.textContent = '草稿已保存 ' + new Date().toTimeString().slice(0, 5);
  }catch(e){}
}
function readDraft(){
  try{
    var raw = lsGet(DRAFT_KEY);
    if(!raw) return null;
    var d = JSON.parse(raw);
    if(!d || !d.items || !d.items.length) return null;
    d.date = fixDateStr(d.date);
    if(d.terms){
      d.terms.deliveryDate = fixDateStr(d.terms.deliveryDate);
      d.terms.etd = fixDateStr(d.terms.etd);
      d.terms.eta = fixDateStr(d.terms.eta);
    }
    return d;
  }catch(e){ return null; }
}
function clearDraft(){ lsDel(DRAFT_KEY); }

function paintPreview(){
  var host = document.getElementById('wsCanvas');
  if(!host || !WORK) return;
  if(WS.fit) WS.zoom = fitZoom();
  var html = renderDoc(WORK, WS.tab, WS.lang, WS.theme, wsDocNo(WS.tab), WS.opts);
  host.innerHTML = '<div class="doc-scaler" id="scaler"><div class="doc-zoom" style="transform:scale(' + WS.zoom + ')">' + html + '</div></div>';
  var doc = host.querySelector('.doc'), scaler = document.getElementById('scaler');
  if(doc && scaler){
    scaler.style.width = Math.round(doc.offsetWidth * WS.zoom) + 'px';
    scaler.style.height = Math.round(doc.offsetHeight * WS.zoom) + 'px';
  }
  var zv = document.getElementById('zoomVal');
  if(zv) zv.textContent = Math.round(WS.zoom * 100) + '%';
}
function fitZoom(){
  var host = document.getElementById('wsCanvas');
  if(!host) return 1;
  var w = (host.clientWidth || 900) - 44;
  return Math.max(0.3, Math.min(1.5, w / 794));
}

function statsData(){
  var now = new Date();
  var curMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  function keyOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  function buildMonths(endM){
    var m = {};
    for(var i = 5; i >= 0; i--){
      var dt = new Date(endM.getFullYear(), endM.getMonth() - i, 1);
      m[keyOf(dt)] = {label:(dt.getMonth() + 1) + '月', orders:0, amount:0};
    }
    return m;
  }
  /* 最近一单所在月份 */
  var latest = null;
  S.orders.forEach(function(o){
    var d = new Date(o.date);
    if(isNaN(d.getTime())) return;
    var m = new Date(d.getFullYear(), d.getMonth(), 1);
    if(!latest || m.getTime() > latest.getTime()) latest = m;
  });
  var end = curMonth;
  if(latest && latest.getTime() > end.getTime()) end = latest;
  var months = buildMonths(end);
  function hasIn(ms){
    return S.orders.some(function(o){
      var d = new Date(o.date);
      return !isNaN(d.getTime()) && !!ms[keyOf(d)];
    });
  }
  var shifted = false;
  /* 当前 6 个月没有任何单据，但历史有：窗口挪到最近一单所在月，避免画成一条平线 */
  if(!hasIn(months) && latest){
    months = buildMonths(latest); shifted = true;
  }
  var prodSales = {}, custSales = {};
  S.orders.forEach(function(o){
    var dt2 = new Date(o.date);
    if(!isNaN(dt2.getTime())){
      var key = keyOf(dt2);
      var amt = orderAmount(o);
      if(months[key]){ months[key].orders++; months[key].amount += amt; }
    }
    (o.items || []).forEach(function(it){
      var p = itemProduct(it);
      var lineAmt = toCNY(calcLine(it).amount, it.currency || o.terms.currency);
      var k = p.name || '未命名';
      prodSales[k] = (prodSales[k] || 0) + lineAmt;
    });
    var ck = orderCustomer(o).company || '未知客户';
    var amt2 = orderAmount(o);
    custSales[ck] = (custSales[ck] || 0) + amt2;
  });
  var ks = Object.keys(months);
  return {
    months: months,
    range: {from: ks[0], to: ks[ks.length - 1], shifted: shifted},
    topProds: Object.keys(prodSales).map(function(k){ return {name:k, v:prodSales[k]}; }).sort(function(a, b){ return b.v - a.v; }).slice(0, 8),
    custs: Object.keys(custSales).map(function(k){ return {name:k, v:custSales[k]}; }).sort(function(a, b){ return b.v - a.v; })
  };
}
function exportStats(){
  var d = statsData();
  var rows = [[{v:'月份', b:true, fill:'FFF6E7E7'}, {v:'订单数', b:true, fill:'FFF6E7E7'}, {v:'销售额(CNY)', b:true, fill:'FFF6E7E7'}]];
  Object.keys(d.months).forEach(function(k){ rows.push([d.months[k].label, d.months[k].orders, +d.months[k].amount.toFixed(2)]); });
  rows.push([]);
  rows.push([{v:'产品销售额排名', b:true, fill:'FFF6E7E7'}, {v:'销售额(CNY)', b:true, fill:'FFF6E7E7'}]);
  d.topProds.forEach(function(p){ rows.push([p.name, +p.v.toFixed(2)]); });
  rows.push([]);
  rows.push([{v:'客户销售额排名', b:true, fill:'FFF6E7E7'}, {v:'销售额(CNY)', b:true, fill:'FFF6E7E7'}]);
  d.custs.forEach(function(c){ rows.push([c.name, +c.v.toFixed(2)]); });
  var blob = makeXlsx([{name:'统计报表', cols:[{w:26},{w:14},{w:16}], rows:rows}]);

}

function collectReminders(){
  var arr = [], now = new Date(); now.setHours(0, 0, 0, 0);
  S.orders.forEach(function(o){
    (o.reminders || []).forEach(function(r){
      var dt = new Date(r.date + 'T00:00:00');
      arr.push({id:r.id, orderId:o.id, orderNo:o.orderNo, customer:orderCustomer(o).company, node:r.node, date:r.date, before:r.before || 0, done:!!r.done, days:Math.round((dt - now) / 86400000)});
    });
  });
  return arr.sort(function(a, b){ return a.days - b.days; });
}

/* ========== 视图 4/4：单证模板库（59 份） ========== */
var TPL_FILTER = {q:'', mod:'', scope:''};
var TPL_DOC = null;                 // 当前打开的模板 {k, text, origin}
var TPL_MODE = 'edit';              // 移动端：edit / preview
var TPL_OUT = true;                 // true = 客户版（隐藏内部标记），false = 内部版
var TPL_TIMER = null;

var SCOPE_META = {
  out:   {t:'可外发', c:'out'},
  in:    {t:'仅内部', c:'in'},
  sup:   {t:'供方用', c:'sup'},
  mixed: {t:'内外通用', c:'mix'}
};
var LAY_META = {form:'表单', letter:'信函', mixed:'混合', table:'表格'};

/* ---------- 取模板 ---------- */
function tplByKey(k){
  for(var i=0;i<TPL_LIB.length;i++){ if(TPL_LIB[i].k === k) return TPL_LIB[i]; }
  return null;
}
function tplNameParts(n){
  var str = String(n || '');
  var m = str.match(/^([\u3000-\u9fff（）()、·\/#\s\d\-]+?)\s+([A-Za-z].*)$/);
  if(m){
    var cn = m[1].trim(), en = m[2].trim();
    var open = (cn.match(/[（(]/g) || []).length;
    var close = (cn.match(/[）)]/g) || []).length;
    // 括号没配平说明英文被截断在括号里，不拆
    if(open === close && en.length >= 3) return {cn:cn, en:en};
  }
  return {cn:str, en:''};
}
function tplFillKey(k){ return 'tplFill_' + k; }

/* ---------- 文本智能渲染 ---------- */
// 明确是"给填表人看的说明"的括注关键词；条款正文里的举例（如 including ...）不在内
var HINT_RE = /\((?=[^)]*(Tick|copy the block|standard wording|not to be deleted|Say in words|e\.g\.|if more items|optional))[A-Za-z][^()]{2,140}\)/gi;

function tdMark(s, cust, dropHint){
  var h = esc(s);
  if(cust){
    // 客户版：去掉【必填】【收款账户】这类内部标记
    h = h.replace(/【[^】]{1,24}】/g, '');
    // 括注清理必须在填空位替换之前做，否则 span 会把长度撑爆
    // 条款正文（长句、带句读）里的括号是内容举例，要留；其余都是填表说明，删掉
    var isClause = String(s).length > 80 && (/\.\s+[A-Z]/.test(s) || /[。；]/.test(s));
    if(isClause){
      h = h.replace(HINT_RE, '');
    } else {
      h = h.replace(/[ \u3000]*\([A-Za-z][^()]{2,140}\)/g, '');
    }
  } else {
    h = h.replace(/【必填】/g, '<span class="td-req">必填</span>');
    h = h.replace(/【([^】]{1,24})】/g, '<span class="td-req">$1</span>');
    h = h.replace(/(\([A-Za-z][^()]{2,140}\))/g, '<span class="td-hint">$1</span>');
  }
  h = h.replace(/_{3,}/g, function(m){ return '<span class="td-bl" style="min-width:' + Math.min(120, Math.max(48, m.length * 7)) + 'px"></span>'; });
  return h;
}
function tplRenderDoc(text, cust){
  var lines = String(text || '').split(/\r?\n/);
  var out = [], titleDone = false, i = 0;
  while(i < lines.length){
    var raw = lines[i], t = raw.trim();
    if(!t){ i++; continue; }

    // 分节标题：===== 1. 报关委托书 =====
    var sec = t.match(/^={3,}\s*(.+?)\s*={3,}$/);
    if(sec){ out.push('<div class="td-sec">' + esc(sec[1]) + '</div>'); i++; continue; }

    // 分隔线
    if(/^[─—\-–_=]{8,}$/.test(t)){ out.push('<div class="td-hr"></div>'); i++; continue; }

    // 内部提示行：客户版整行丢弃
    if(t.charAt(0) === '▸'){
      if(cust){ i++; continue; }
      var body = t.replace(/^▸\s*(Tip\s*[:：]?|新手提示\s*[:：]?)?\s*/i, '');
      out.push('<div class="td-tip">' + tdMark(body) + '</div>'); i++; continue;
    }

    // 固定条款
    if(t.charAt(0) === '★'){
      out.push('<div class="td-clause">' + tdMark(t.replace(/^★\s*/, ''), cust) + '</div>'); i++; continue;
    }

    // 首行 = 标题
    if(!titleDone){
      titleDone = true;
      var tt = cust ? esc(t).replace(/【[^】]{1,24}】/g, '') : esc(t);
      out.push('<div class="td-title">' + tt + '</div>'); i++; continue;
    }

    // 表格行（全角竖线分隔）
    if(t.indexOf('｜') >= 0){
      out.push('<div class="td-row">' + esc(t) + '</div>'); i++; continue;
    }

    // 编号小节标题：1. Parties / 4. Commercial Terms
    if(/^\d+[.、]\s*[^\s]{2,20}$/.test(t) || /^[一二三四五六七八九十]+[、.]/.test(t)){
      out.push('<div class="td-h4">' + esc(t) + '</div>'); i++; continue;
    }

    // 缩进行
    var ind = /^\s{2,}/.test(raw) ? ' ind' : '';
    var hasBlank = /_{3,}/.test(t);
    if(cust && !hasBlank && !(t.length > 80 && (/\.\s+[A-Z]/.test(t) || /[。；]/.test(t)))){
      var bare = t.replace(/[ \u3000]*\([A-Za-z][^()]{2,140}\)/g, '').replace(/[\s:：·—\-]/g, '');
      if(bare.length <= 2){ i++; continue; }     // 整行都是说明，删掉
    }
    out.push('<div class="td-p' + ind + '">' + tdMark(t, cust) + '</div>');
    i++;
  }
  return out.join('');
}

/* ---------- 列表页 ---------- */
function renderTplPage(){
  var f = TPL_FILTER;
  var list = TPL_LIB.filter(function(x){
    if(f.mod && x.m !== f.mod) return false;
    if(f.scope && x.sc !== f.scope) return false;
    if(f.q){
      var q = f.q.toLowerCase();
      if((x.n||'').toLowerCase().indexOf(q) < 0 &&
         (x.d||'').toLowerCase().indexOf(q) < 0 &&
         (x.t||'').toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  });

  // 统计
  var total = TPL_LIB.length;
  var shown = list.length;
  var filled = TPL_LIB.filter(function(x){ return !!lsGet(tplFillKey(x.k)); }).length;

  // 模块筛选条
  var chips = '<div class="tchip on" onclick="A.tplFilter(\'mod\',\'\')">全部 ' + total + '</div>' +
    TPL_MODS.map(function(m){

/* ---------- 智能带入 ---------- */
function tplFillCompany(text){
  var c = S.settings.company || {}, b = S.settings.bank || {};
  // 买方：优先用客户库第一位，其次最近一张订单的客户
  var buyer = (S.customers && S.customers[0]) || {};
  if(!buyer.company && S.orders && S.orders.length){
    buyer = orderCustomer(S.orders[0]) || buyer;
  }

  var SELLER = [
    ['Company\\s*Name', c.nameEn || c.name],
    ['Bank\\s*Address|开户行地址', b.bankAddress],
    ['Bank\\s*Name|开户行|银行名称', b.bankName],
    ['Account\\s*Name|账户名|户名|收款人', b.beneficiary],
    ['Account\\s*No\\.?|账号|帐号', b.accountNo],
    ['SWIFT|BIC', b.swiftCode],
    ['Address|地址', c.address, 'Bank\\s*Address'],
    ['Website|网址', c.website],
    ['E-?mail|邮箱|电子邮箱', c.email],
    ['Fax|传真', c.fax],
    ['Tel|电话|联系电话', c.tel],
    ['委托方|公司名称|我方公司|卖方', c.name]
  ];
  var BUYER = [
    ['Company\\s*Name', buyer.company],
    ['Address|地址', buyer.address, 'Bank\\s*Address'],
    ['Attn|Contact|联系人', buyer.contact],
    ['E-?mail|邮箱', buyer.email],
    ['Tel|电话', buyer.tel]
  ];

  function pick(txt, rules){
    var best = null, bestPos = -1, bestLen = -1;
    for(var i=0;i<rules.length;i++){
      if(!rules[i][1]) continue;
      if(rules[i][2] && new RegExp(rules[i][2], 'i').test(txt)) continue;  // 排除更具体的字段
      var m = txt.match(new RegExp(rules[i][0], 'i'));
      if(m && (m.index > bestPos || (m.index === bestPos && m[0].length > bestLen))){
        bestPos = m.index; bestLen = m[0].length; best = rules[i][1];
      }
    }
    return best;
  }
  // 标签写在填空右侧时，只认紧跟在后面的括号短语，如 ______ (Company Name)
  function sideLabel(s){
    var m = String(s || '').match(/^[）)\s]*[(（]([^)）]{2,30})[)）]/);
    return m ? m[1] : '';
  }

  // 按「设置 → 制单默认」勾选贸易术语（□FOB → ☑FOB）
  var term = ((S.settings.defaults || {}).tradeTerm || '').toUpperCase();
  if(term){
    text = text.replace(new RegExp('□\\s*' + term + '(?![A-Z])', 'g'), '☑ ' + term);
  }

  var mode = 'seller';
  return text.split(/\r?\n/).map(function(line){
    if(/^\s*To\s*(\/|：|:)/i.test(line) || /^\s*(Buyer|Consignee|客户|买方|收货人)/i.test(line)) mode = 'buyer';
    else if(/^\s*From\s*(\/|：|:)/i.test(line) || /^\s*(Seller|卖方|供货方)/i.test(line)) mode = 'seller';
    else if(/Bank\s*Details|Banking\s*Details|银行资料|银行信息|收款账户|开户行/i.test(line)) mode = 'seller';

    if(line.indexOf('___') < 0) return line;
    var rules = mode === 'buyer' ? BUYER : SELLER;
    var parts = line.split(/(_{3,})/);
    for(var i=1;i<parts.length;i+=2){
      var v = pick(parts[i-1], rules);
      if(!v){
        var lbl = sideLabel(parts[i+1]);
        if(lbl) v = pick(lbl, rules);
      }
      if(v) parts[i] = v;
    }
    return parts.join('');
  }).join('\n');
}

/* 客户版纯文本：去掉内部提示行、【】标记、已填行的字段括注 */
function tplOutText(text){
  return String(text || '').split(/\r?\n/).map(function(line){
    if(/^\s*▸/.test(line)) return null;
    var l = line.replace(/【[^】]{1,24}】/g, '');
    var isCl = l.length > 80 && (/\.\s+[A-Z]/.test(l) || /[。；]/.test(l));
    l = isCl ? l.replace(HINT_RE, '') : l.replace(/[ \u3000]*\([A-Za-z][^()]{2,140}\)/g, '');
    return l;
  }).filter(function(l){ return l !== null; })
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
function tplCopyFallback(t){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制全文'); }
  catch(e){ toast('复制失败，请手动选中文本复制', false); }
  ta.remove();
}
/* 文件名用紧凑日期（YYYYMMDD），不要覆盖全局 todayStr */
function fileStamp(){
  var d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

/* ---------- 预览缩放到容器宽度 ---------- */
function fitTplDoc(){
  var canvas = document.querySelector('.tws-canvas');
  var zoom = document.getElementById('tplZoom');
  var doc = document.getElementById('tplDoc');
  if(!canvas || !zoom || !doc) return;
  var A4 = 794;                                  // 210mm @96dpi
  var avail = canvas.clientWidth - 36;
  if(avail <= 0) return;
  var s = Math.min(1, avail / A4);
  doc.style.position = 'absolute';
  doc.style.top = '0';
  doc.style.left = '0';
  doc.style.transformOrigin = 'top left';
  doc.style.transform = 'scale(' + s + ')';
  zoom.style.width = (A4 * s) + 'px';
  zoom.style.height = (doc.offsetHeight * s) + 'px';
}

/* ========== 轻量 Canvas 图表（无依赖） ========== */
function chartCtx(id){
  var c = document.getElementById(id);
  if(!c) return null;
  var dpr = window.devicePixelRatio || 1;
  if(!c.dataset.h) c.dataset.h = c.getAttribute('height') || 220;   // 记住逻辑高度（避免被 dpr 覆盖）
  var baseH = +c.dataset.h;
  var wrap = c.parentElement;
  var w = 600;
  if(wrap && wrap.clientWidth){
    var cs = getComputedStyle(wrap);
    w = wrap.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
  } else { w = c.clientWidth || 600; }
  w = Math.max(240, Math.floor(w));
  c.width = Math.round(w * dpr);
  c.height = Math.round(baseH * dpr);
  c.style.width = w + 'px';                              // 固定 CSS 尺寸，避免高 DPI 下被放大
  c.style.height = baseH + 'px';
  var ctx = c.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, baseH);
  return {ctx: ctx, w: w, h: baseH};
}
function fmtAxis(v){
  if(v >= 10000) return (v / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(Math.round(v));
}
/* 坐标轴取整：保证 4 段刻度都是干净数字，避免出现 1/1/1/0/0 这种重复标签 */
function niceScale(max, ticks){
  ticks = ticks || 4;
  if(!(max > 0)) return {max: ticks, step: 1};
  var raw = max / ticks;
  var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var n = raw / mag;
  var B = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  var pick = 10;
  for(var i = 0; i < B.length; i++){ if(B[i] >= n - 1e-9){ pick = B[i]; break; } }
  var step = pick * mag;
  if(step < 1) step = 1;                 /* 刻度不足 1 会被取整成重复标签 */
  return {max: step * ticks, step: step};
}

/* 柱状图 + 折线图组合 */
function drawCombo(id, labels, bars, line, barLabel, lineLabel){
  var c = chartCtx(id); if(!c) return;
  var ctx = c.ctx, W = c.w, H = c.h;
  var sumB = 0, sumL = 0;
  bars.forEach(function(v){ sumB += (+v || 0); });
  line.forEach(function(v){ sumL += (+v || 0); });
  if(!sumB && !sumL){
    ctx.fillStyle = '#98a2b3'; ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('暂无数据', W / 2, H / 2 - 6);
    ctx.font = '11.5px system-ui, sans-serif'; ctx.fillStyle = '#b4bac4';
    ctx.fillText('新建单据并填写日期后，这里会自动出趋势', W / 2, H / 2 + 14);
    return;
  }
  var padL = 46, padR = 46, padT = 24, padB = 30;
  var iw = W - padL - padR, ih = H - padT - padB;
  var maxB = Math.max.apply(null, bars.concat([0]));
  var tickN = maxB <= 2 ? 2 : 4;              /* 单量很少时用 2 段刻度，柱子不会显得过矮 */
  var sB = niceScale(maxB, tickN);
  var sL = niceScale(Math.max.apply(null, line.concat([0])), tickN);
  var maxBar = sB.max, maxLine = sL.max;

  ctx.font = '11px system-ui, sans-serif';
  ctx.strokeStyle = '#eceef1'; ctx.lineWidth = 1;
  for(var i = 0; i <= tickN; i++){
    var y = padT + ih - (ih * i / tickN);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillStyle = '#98a2b3';
    ctx.fillText(fmtAxis(sB.step * i), padL - 6, y + 4);
    ctx.textAlign = 'left'; ctx.fillStyle = '#d08a1e';
    ctx.fillText(fmtAxis(sL.step * i), W - padR + 6, y + 4);
  }

  var step = iw / labels.length, bw = Math.min(34, step * 0.5);
  bars.forEach(function(v, i){
    var x = padL + step * i + (step - bw) / 2;
    var bh = ih * (v / maxBar);
    if(bh > 0.5){
      var g = ctx.createLinearGradient(0, padT + ih - bh, 0, padT + ih);
      g.addColorStop(0, '#93c5fd'); g.addColorStop(1, '#3b82f6');
      ctx.fillStyle = g;
      roundRect(ctx, x, padT + ih - bh, bw, bh, 3); ctx.fill();
    }
    ctx.fillStyle = '#6b7280'; ctx.textAlign = 'center';
    ctx.fillText(labels[i], padL + step * i + step / 2, H - 10);
    if(v > 0){
      ctx.fillStyle = '#1e40af'; ctx.font = 'bold 10px system-ui';
      ctx.fillText(String(v), padL + step * i + step / 2, padT + ih - bh - 5);
      ctx.font = '11px system-ui, sans-serif';
    }
  });

  ctx.beginPath(); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
  line.forEach(function(v, i){
    var x = padL + step * i + step / 2, y = padT + ih - ih * (v / maxLine);
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  line.forEach(function(v, i){
    var x = padL + step * i + step / 2, y = padT + ih - ih * (v / maxLine);
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
  });

  ctx.textAlign = 'left'; ctx.fillStyle = '#3b82f6'; ctx.font = '11px system-ui, sans-serif';
  ctx.fillText('■ ' + barLabel, padL, 12);
  ctx.fillStyle = '#f59e0b';
  ctx.fillText('● ' + lineLabel, padL + ctx.measureText('■ ' + barLabel).width + 18, 12);
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
/* 横向条形图 */
function drawHBar(id, data){
  var c = chartCtx(id); if(!c) return;
  var ctx = c.ctx, W = c.w, H = c.h;
  if(!data.length){ ctx.fillStyle = '#9ca3af'; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('暂无数据', W / 2, H / 2); return; }
  var padL = 130, padR = 60, padT = 10;
  var ih = H - padT - 10, n = data.length, bh = Math.min(22, ih / n - 6);
  var max = Math.max.apply(null, data.map(function(d){ return d.v; }).concat([1]));
  data.forEach(function(d, i){
    var y = padT + i * (ih / n) + (ih / n - bh) / 2;
    ctx.fillStyle = '#374151'; ctx.font = '11px system-ui'; ctx.textAlign = 'right';
    var name = d.name.length > 12 ? d.name.slice(0, 12) + '…' : d.name;
    ctx.fillText(name, padL - 8, y + bh / 2 + 4);
    var bw = (W - padL - padR) * (d.v / max);
    var g = ctx.createLinearGradient(padL, 0, padL + bw, 0);
    g.addColorStop(0, '#3b82f6'); g.addColorStop(1, '#93c5fd');
    ctx.fillStyle = g;
    roundRect(ctx, padL, y, Math.max(bw, 2), bh, 3); ctx.fill();
    ctx.fillStyle = '#111827'; ctx.textAlign = 'left';
    ctx.fillText('¥' + fmtAxis(d.v), padL + bw + 6, y + bh / 2 + 4);
  });
}
/* 环形图 */
function drawDoughnut(id, data){
  var c = chartCtx(id); if(!c) return;
  var ctx = c.ctx, W = c.w, H = c.h;
  if(!data.length){ ctx.fillStyle = '#9ca3af'; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('暂无数据', W / 2, H / 2); return; }
  var total = data.reduce(function(a, d){ return a + d.v; }, 0);
  var colors = ['#3b82f6','#f59e0b','#10b981','#8b5cf6','#ef4444','#06b6d4','#f97316','#84cc16','#ec4899','#64748b'];
  var cx = Math.min(150, W * 0.32), cy = H / 2, r = Math.min(80, H / 2 - 20), ir = r * 0.58;
  var ang = -Math.PI / 2;
  data.slice(0, 9).forEach(function(d, i){
    var a2 = ang + Math.PI * 2 * (d.v / total);
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, ang, a2); ctx.closePath();
    ctx.fillStyle = colors[i % colors.length]; ctx.fill();
    ang = a2;
  });
  ctx.beginPath(); ctx.arc(cx, cy, ir, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#111827'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('¥' + fmtAxis(total), cx, cy - 2);
  ctx.font = '10px system-ui'; ctx.fillStyle = '#6b7280';
  ctx.fillText('总销售额', cx, cy + 14);
  var ly = 18, lx = cx + r + 24;
  data.slice(0, 9).forEach(function(d, i){
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(lx, ly - 8, 9, 9);
    ctx.fillStyle = '#374151'; ctx.font = '11px system-ui'; ctx.textAlign = 'left';
    var name = d.name.length > 10 ? d.name.slice(0, 10) + '…' : d.name;
    ctx.fillText(name + ' ' + Math.round(d.v / total * 100) + '%', lx + 14, ly);
    ly += 19;
  });
}

  runImportProducts: function(text){
    var lines = text.split(/\r?\n/), count = 0, headers = null;
    var H = ['name','nameEn','model','hsCode','spec','specEn','price','currency','unit','pcsPerCtn','nwPerCtn','gwPerCtn','cbmPerCtn','category','supplier'];
    lines.forEach(function(line, li){
      if(!line.trim()) return;
      var cells = line.split(/\t|,/).map(function(s){ return s.trim(); });
      if(li === 0 && /名称|name|产品/i.test(cells[0] || '')){ headers = cells; return; }
      var p = {id:uid()};
      if(headers){ headers.forEach(function(h, i){ if(H[i]) p[H[i]] = cells[i] || ''; }); }
      else { H.forEach(function(k, i){ p[k] = cells[i] || ''; }); }
      ['price','pcsPerCtn','nwPerCtn','gwPerCtn','cbmPerCtn'].forEach(function(k){ p[k] = +p[k] || 0; });
      p.pcsPerCtn = p.pcsPerCtn || 1;
      p.image = '';
      if(p.name){ S.products.push(p); count++; }
    });
    saveState(); hideSkeleton(); render();
    toast(count ? '成功导入 ' + count + ' 个产品' : '未识别到数据，请检查格式', count > 0);
  },

    confirmBox('载入演示数据会覆盖现有数据（公司 / 产品 / 客户 / 单据均为虚构示例）。确定载入？', function(){
      loadSampleData(); WORK = null; clearDraft(); toast('演示数据已载入，看完可在「设置 → 数据与推送」一键清空', true); ROUTE = 'docs'; render();
    });
  },
  clearData: function(){
    confirmBox('清空全部数据？单据、客户、产品与设置都会删除且无法恢复，建议先导出备份。确定清空？', function(){
      clearAllData(); WORK = null; clearDraft(); toast('已清空', true); ROUTE = 'docs'; render();
    });
  },
  toggleDocFilters: function(){ DOCS_FILTER_OPEN = !DOCS_FILTER_OPEN; render(); },
  clearDocFilters: function(){
    ORDER_FILTER.status = ''; ORDER_FILTER.from = ''; ORDER_FILTER.to = '';
    DOCS_FILTER_OPEN = false; render();
  },
  setFilter: function(k, v){
    ORDER_FILTER[k] = v;
    var el = document.querySelector('#page .search');
    if(k === 'q' && el){
      var pos = el.selectionStart; render();
      var el2 = document.querySelector('#page .search');
      if(el2){ el2.focus(); el2.setSelectionRange(pos, pos); }
    } else render();
  },
  closeModal: function(){
    var m = document.getElementById('modalRoot');
    m.classList.remove('open'); m.innerHTML = '';
  }
};

/* ---------- 辅助 ---------- */
function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function fmtDate(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function orderFileName(o, ext){
  var c = (orderCustomer(o).company || '客户').replace(/[\\/:*?"<>|]/g, '');
  var p = (o.items[0] ? (itemProduct(o.items[0]).name || itemProduct(o.items[0]).nameEn) : '产品' || '产品').replace(/[\\/:*?"<>|]/g, '');
  return c + '-' + p + '-' + o.date + '-' + o.orderNo + '.' + ext;
}
function readProductForm(){
  var img = PROD_IMG;
  if(!img){
    var pv = document.getElementById('pf-imgPreview');
    var im = pv ? pv.querySelector('img') : null;
    if(im) img = im.getAttribute('src');
  }
  return {
    name: val('pf-name'), nameEn: val('pf-nameEn'), model: val('pf-model'), hsCode: val('pf-hs'),
    spec: val('pf-spec'), specEn: val('pf-specEn'), price: +val('pf-price') || 0, currency: val('pf-currency'),
    unit: val('pf-unit'), pcsPerCtn: +val('pf-pcsCtn') || 1, nwPerCtn: +val('pf-nw') || 0,
    gwPerCtn: +val('pf-gw') || 0, cbmPerCtn: +val('pf-cbm') || 0, category: val('pf-cat'),
    supplier: val('pf-sup'), image: img || '', notes: ''
  };
}
function readCustomerForm(){
  return {
    company: val('cf-company'), companyEn: val('cf-companyEn'), contact: val('cf-contact'), address: val('cf-address'),
    email: val('cf-email'), phone: val('cf-phone'), whatsapp: val('cf-wa'), language: val('cf-lang'),
    tradeTerm: val('cf-term'), tags: val('cf-tags').split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean),
    notes: val('cf-notes')
  };
}
function openModal(html){
  var m = document.getElementById('modalRoot');
  m.innerHTML = '<div class="mask" onclick="if(event.target===this)A.closeModal()"></div><div class="modal">' + html + '</div>';
  m.classList.add('open');
}
function confirmBox(msg, onOk){
  openModal('<div class="modal-h"><h3>请确认</h3><button class="close" onclick="A.closeModal()">' + ic('close', 14) + '</button></div>' +
    '<div class="modal-b"><p style="font-size:13.5px;line-height:1.7">' + esc(msg) + '</p></div>' +
    '<div class="modal-f"><button class="btn btn-ghost btn-sm" onclick="A.closeModal()">取消</button>' +
    '<button class="btn btn-primary btn-sm" onclick="A._ok()">确定</button></div>');
  A._ok = function(){ A.closeModal(); onOk(); };
}
function doPrint(types){
  if(typeof LIC !== 'undefined' && !LIC.canExport()){ LIC.blockExport(); return; }
  if(!WORK || !WORK.items.length){ toast('请先添加产品', false); return; }
  var html = types.map(function(t){
    return renderDoc(WORK, t, WS.lang, WS.theme, wsDocNo(t), WS.opts);
  }).join('');   /* 不再插 .pb：.doc 自带 page-break-after，双分页会产生空白页 */
  document.getElementById('printArea').innerHTML = html;
  if(S.settings.printTip === false){ setTimeout(function(){ window.print(); }, 150); return; }
  openModal('<div class="modal-h"><h3>导出为 PDF</h3><button class="close" onclick="A.closeModal()">' + ic('close', 14) + '</button></div>' +
    '<div class="modal-b" style="font-size:12.5px;color:var(--ink2);line-height:1.85">' +
      '<p>接下来会打开系统的打印窗口，按下面设置就能得到和预览一致的 PDF：</p>' +
      '<ul style="margin:8px 0 10px 18px">' +
        '<li>目标打印机 → <b>另存为 PDF</b></li>' +
        '<li>缩放 → <b>100%</b>，不要勾选「适应页面宽度」</li>' +
        '<li>边距 → <b>无</b>（或「默认」）</li>' +
        '<li>展开「更多设置」，勾选 <b>背景图形</b></li>' +
      '</ul>' +
      '<p class="xs faint">不勾选背景图形，主题色块和签章底色会被浏览器去掉，单据会变成黑白。</p>' +
      '<label class="check" style="margin-top:10px"><input type="checkbox" id="printTipOff"> 不再提示</label>' +
    '</div>' +
    '<div class="modal-f"><button class="btn btn-ghost btn-sm" onclick="A.closeModal()">取消</button>' +
    '<button class="btn btn-primary btn-sm" onclick="A.goPrint()">好，继续</button></div>');
}
A_goPrint = null;
/* ---------- 骨架屏（只在真正等待时出现，短于 180ms 不显示） ---------- */
var SKEL_TIMER = null;
function showSkeleton(hostId, html, delay){
  clearTimeout(SKEL_TIMER);
  SKEL_TIMER = setTimeout(function(){
    var h = document.getElementById(hostId);
    if(h) h.innerHTML = html;
  }, delay == null ? 180 : delay);
}
function hideSkeleton(){ clearTimeout(SKEL_TIMER); SKEL_TIMER = null; }
function skelRows(n){
  var out = '';
  for(var i = 0; i < (n || 5); i++){
    out += '<div style="display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line2)">' +
      '<div class="skel" style="width:110px;height:12px"></div>' +
      '<div class="skel" style="width:150px;height:12px"></div>' +
      '<div class="skel" style="width:80px;height:12px"></div>' +
      '<div class="skel" style="width:96px;height:12px;margin-left:auto"></div></div>';
  }
  return '<div class="skel-wrap">' + out + '</div>';
}

/* ---------- 环境提示（微信内置浏览器 / 存储受限） ---------- */
function showEnvNotice(msg){
  if(document.getElementById('envNotice')) return;
  var d = document.createElement('div');
  d.id = 'envNotice'; d.className = 'env-notice';
  d.innerHTML = '<div class="en-txt">' + esc(msg) + '</div><div class="en-acts">' +
    '<button class="btn btn-ghost btn-xs" onclick="A.exportBackup()">导出备份</button>' +
    '<button class="btn btn-ghost btn-xs" onclick="var n=document.getElementById(\'envNotice\');if(n)n.remove()">知道了</button></div>';
  document.body.appendChild(d);
}
/* ---------- 微信推送 ---------- */
function pushWechat(url, content){
  fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({msgtype:'markdown', markdown:{content:content}})})
    .then(function(r){ return r.json(); })
    .then(function(j){ toast(j && j.errcode === 0 ? '微信推送成功' : '推送失败：' + ((j && j.errmsg) || '未知错误'), !!(j && j.errcode === 0)); })
    .catch(function(){ toast('推送失败：网络错误或 Webhook 无效', false); });
}
/* ---------- 到期检查 ---------- */
var NOTIFIED = {};
var NOTIFIED_KEY = 'td_notified';
function notifiedMap(){
  try{
    var o = JSON.parse(lsGet(NOTIFIED_KEY) || '{}');
    if(o && o.day === todayStr()) return o.ids || {};      /* 跨天自动失效，隔天重新提醒一次 */
  }catch(e){}
  return {};
}
function markNotified(id){
  var ids = notifiedMap(); ids[id] = 1;
  try{ lsSet(NOTIFIED_KEY, JSON.stringify({day: todayStr(), ids: ids})); }catch(e){}
  NOTIFIED[id] = 1;
}
function checkReminders(){
  var list = collectReminders().filter(function(r){ return !r.done && r.days <= 0 && !NOTIFIED[r.id] && !notifiedMap()[r.id]; });
  if(!list.length) return;
  if(S.settings.notify !== false && 'Notification' in window){
    if(Notification.permission === 'granted'){
      list.forEach(function(r){
        markNotified(r.id);
        new Notification('跟单提醒：' + r.node, {body: r.orderNo + ' · ' + (r.customer || '') + ' · ' + r.date});
      });
    } else if(Notification.permission !== 'denied'){
      try{ var pr = Notification.requestPermission(); if(pr && pr.catch) pr.catch(function(){}); }catch(e){}
    }
  }
  if(S.settings.wechatWebhook){
    list.forEach(function(r){
      markNotified(r.id);
      pushWechat(S.settings.wechatWebhook, '【跟单提醒】\n**' + r.node + '**\n> 订单：' + r.orderNo + '\n> 客户：' + (r.customer || '-') + '\n> 节点：' + r.date + (r.days === 0 ? '（今天）' : '（已逾期' + (-r.days) + '天）'));
    });
  }
}
setInterval(checkReminders, 5 * 60 * 1000);

/* ---------- Android APK 桥接（浏览器中自动跳过） ---------- */
(function(){
  if(typeof AndroidBridge === 'undefined') return;
  window.downloadBlob = function(blob, filename){
    try{
      var fr = new FileReader();
      fr.onload = function(){
        var b64 = String(fr.result).split(',')[1] || '';
        AndroidBridge.saveFile(b64, filename, blob.type || 'application/octet-stream');
      };
      fr.onerror = function(){ AndroidBridge.toast('读取文件失败'); };
      fr.readAsDataURL(blob);
    }catch(e){ AndroidBridge.toast('导出失败：' + e.message); }
    return true;
  };
  window.print = function(){
    var pa = document.getElementById('printArea');
    if(!pa || !pa.innerHTML){ AndroidBridge.toast('请先生成单据'); return; }
    var st = document.querySelector('style');
    var css = st ? st.textContent : '';
    AndroidBridge.print('<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + css +
      '</style></head><body>' + pa.innerHTML + '</body></html>');
  };
})();


/* ========== 启动 ========== */
loadState();
var _wx = /MicroMessenger|QQ\/|Weibo/i.test(navigator.userAgent || '');
var _ok = storageCheck();
function boot(){
  if(_wx){
    showEnvNotice('当前在微信内置浏览器中打开，数据可能无法保存。建议点右上角「···」→「在浏览器打开」，用系统浏览器使用本工具（无需登录任何账号）。');
  } else if(!_ok){
    showEnvNotice('当前浏览器限制了本地存储（常见于从文件管理器或聊天工具直接打开），关闭后数据会丢失。建议把文件保存到手机/电脑后，用 Chrome、Edge 或 Safari 打开，并定期导出备份。');
  } else if(/iPad|iPhone|iPod/.test(navigator.userAgent) && navigator.standalone !== true){
    showEnvNotice('检测到你在 iPhone / iPad 上使用：iOS 的 Safari 会在长期无访问后清理本机数据。建议点分享 →「添加到主屏幕」从桌面图标进入，并且每周至少打开一次、定期在设置里导出备份。');
  }
  WS.theme = S.settings.defaults.theme || 'red';
  WS.lang = S.settings.defaults.language || 'en';
  tplHooks();
  render();
  window.addEventListener('resize', function(){
    if(ROUTE === 'insights') drawInsights();
    if(ROUTE === 'editor' && WS.fit) paintPreview();
    if(ROUTE === 'tpldoc') fitTplDoc();
  });
  if('Notification' in window && Notification.permission === 'default' && S.settings.notify !== false){
    setTimeout(function(){ Notification.requestPermission(); }, 4000);
  }
  setTimeout(checkReminders, 1500);
}
window.boot = boot;
LIC.init();
if(!eulaAgreed()){
  document.getElementById('app').innerHTML = eulaHtml();
} else {
  boot();
}
LIC.reguard && LIC.reguard();   /* 模板导出函数是 boot 里才创建的，启动后再包一次 */

</script>
